<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>仁心医院 · 医院模拟器 v1.0.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f4f7f9; --card:#ffffff; --line:#e8eef2; --line2:#d8e2e9;
 --txt:#1b2a35; --dim:#6b7f8d; --dim2:#9aacb8;
 --teal:#2a9d8f; --teal-d:#21867a; --teal-l:#e8f6f4; --teal-b:#bfe6e1;
 --red:#d64545; --red-l:#fdf0f0; --red-b:#f5c6c6;
 --amber:#c07a1a; --amber-l:#fdf6e9; --amber-b:#f2e0bc;
 --green:#2f9e63; --green-l:#eef9f2; --green-b:#c4e8d3;
 --blue:#3e77c9; --blue-l:#eef4fc; --blue-b:#c9dcf3;
 --purple:#7a5cc4;
 --sh:0 1px 3px rgba(27,42,53,.05),0 4px 14px rgba(27,42,53,.04);
}
html,body{height:100%}
body{
 background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-variant-numeric:tabular-nums}
.app{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg);position:relative}
@media(max-width:520px){
 .chip2{padding:4px 7px;font-size:10.5px}
 .chip2 b{font-size:11.5px}
 .hdr{gap:8px;padding:10px 12px}
 .hdr-t small{font-size:10px}
 .chip2.rep{display:none}
}
@media(min-width:901px){body{background:#e9eef2}.app{box-shadow:0 0 40px rgba(27,42,53,.08);border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---------- header ---------- */
.hdr{
 flex:none;display:flex;align-items:center;gap:10px;padding:11px 15px;
 background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
 position:relative;z-index:5;
}
.hdr .logo{
 width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;
 background:linear-gradient(135deg,#8fd3ca,#b7e3dd);box-shadow:0 2px 8px rgba(42,157,143,.22);
}
.hdr-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hdr-t b{font-size:15.5px;font-weight:700;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
.hdr-t small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.chip2{
 display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;
 background:#f7fafb;border:1px solid var(--line);font-size:11.5px;color:var(--dim);
}
.chip2 b{font-size:12.5px;color:var(--txt)}
.icon-btn{
 width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
 background:#f7fafb;border:1px solid var(--line);color:var(--dim);
}
.icon-btn:active{background:#eef3f6}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;padding:14px 15px 20px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:#d3dee6;border-radius:6px}

.pg-title{font-size:21px;font-weight:700;letter-spacing:.3px;margin:4px 0 5px}
.pg-sub{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px}

.card{
 background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;
 box-shadow:var(--sh);margin-bottom:12px;
}
.card.tight{padding:12px 14px}
.card-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px}
.card-h .ico{font-size:15px;opacity:.9}
.card-h .right{margin-left:auto;font-size:11.5px;color:var(--dim);font-weight:400}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{
 background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);
}
.stat .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-bottom:8px}
.stat .v{font-size:21px;font-weight:700;letter-spacing:.3px}

.bar{height:8px;border-radius:8px;background:#edf2f6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#3fb8a9,#2a9d8f);transition:width .45s ease}
.bar.amber i{background:linear-gradient(90deg,#e8b656,#d99a2b)}
.bar.red i{background:linear-gradient(90deg,#e87474,#d64545)}
.bar.blue i{background:linear-gradient(90deg,#6aa4e8,#3e77c9)}

.badge{
 font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid;font-weight:600;white-space:nowrap;
}
.badge.g{background:var(--green-l);color:var(--green);border-color:var(--green-b)}
.badge.a{background:var(--amber-l);color:var(--amber);border-color:var(--amber-b)}
.badge.r{background:var(--red-l);color:var(--red);border-color:var(--red-b)}
.badge.t{background:var(--teal-l);color:var(--teal-d);border-color:var(--teal-b)}
.badge.b{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b)}
.badge.d{background:#f4f7f9;color:var(--dim);border-color:var(--line2)}

.btnp{
 display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
 padding:11px 14px;border-radius:11px;font-size:14px;font-weight:600;
 background:linear-gradient(180deg,#34a99b,#21867a);color:#fff;
 box-shadow:0 3px 10px rgba(42,157,143,.26);transition:.15s;
}
.btnp:active{transform:scale(.985);filter:brightness(.96)}
.btnp:disabled{background:#e6edf1;color:#a8b7c2;box-shadow:none}
.btno{
 display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
 padding:10px 14px;border-radius:11px;font-size:13.5px;
 background:#fff;border:1px solid var(--line2);color:#3c5260;
}
.btno:active{background:#f5f9fa}
.btno:disabled{opacity:.5}

/* ---------- queue / patient rows ---------- */
.plist{display:flex;flex-direction:column;gap:9px}
.prow{
 display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:13px;
 background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:.15s;text-align:left;width:100%;
}
.prow:active{background:#fafcfd}
.prow.crit{border-color:var(--red-b);background:linear-gradient(90deg,#fdf6f6,#fff 40%)}
.prow .av{
 width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;
 background:#f0f5f8;border:1px solid var(--line);
}
.prow.crit .av{background:var(--red-l);border-color:var(--red-b)}
.prow .info{flex:1;min-width:0}
.prow .n1{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.prow .nm{font-size:14.5px;font-weight:600}
.prow .age{font-size:11.5px;color:var(--dim)}
.prow .cc{font-size:12px;color:#4d6373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .go{font-size:11.5px;color:var(--teal);font-weight:600;flex:none}

/* ---------- case ---------- */
.phead{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px}
.phead .av{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#f0f5f8;border:1px solid var(--line);flex:none}
.phead .nm{font-size:17px;font-weight:700}
.phead .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.phead .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.phead .tags .badge{white-space:normal;line-height:1.5}

.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.v{border-radius:10px;padding:8px 9px;background:#f8fafb;border:1px solid #ecf1f5;text-align:center}
.v .k{font-size:10px;color:var(--dim2);margin-bottom:2px}
.v .val{font-size:14px;font-weight:650;color:#243542}
.v.abn{background:var(--red-l);border-color:var(--red-b)}
.v.abn .val{color:var(--red)}
.v.warn{background:var(--amber-l);border-color:var(--amber-b)}
.v.warn .val{color:var(--amber)}

/* 问诊 Q&A */
.qa{border-radius:12px;background:#f7fafb;border:1px solid #edf2f6;padding:11px 13px;margin-bottom:8px;animation:fin .28s ease}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.qa .q{font-size:12.5px;color:var(--teal-d);font-weight:600;margin-bottom:4px}
.qa .a{font-size:13px;color:#33475a;line-height:1.62}
.askmore{
 display:flex;align-items:center;gap:9px;width:100%;padding:12px 13px;border-radius:12px;
 background:var(--teal-l);border:1.5px solid var(--teal-b);text-align:left;transition:.15s;
}
.askmore:active{background:#dcf1ee}
.askmore .t b{display:block;font-size:13.5px;color:#1d6f66;margin-bottom:2px}
.askmore .t span{font-size:11.5px;color:#4f8f88}
.askmore .plus{margin-left:auto;font-size:18px;color:var(--teal);font-weight:600}

.testgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{
 padding:9px 10px;border-radius:11px;background:#fff;border:1px solid var(--line2);
 display:flex;flex-direction:column;gap:2px;text-align:left;transition:.13s;
}
.tbtn:active{background:#f6fafb}
.tbtn .n{font-size:12.5px;font-weight:550;color:#33475a}
.tbtn .c{font-size:10.5px;color:var(--dim2)}
.tbtn.done{background:#f2f9f4;border-color:var(--green-b)}
.tbtn.done .c{color:var(--green)}

.dxopt{
 width:100%;padding:11px 13px;border-radius:11px;background:#fff;border:1px solid var(--line2);
 font-size:13px;text-align:left;margin-bottom:7px;transition:.13s;display:flex;align-items:center;gap:8px;
}
.dxopt:active{background:#f6fafb}
.dxopt .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #c9d6df;flex:none}
.dxopt.sel{border-color:var(--teal);background:var(--teal-l);font-weight:600;color:#1d6f66}
.dxopt.sel .rd{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
.dxopt.off{opacity:.42;text-decoration:line-through;pointer-events:none}

.treat{
 width:100%;padding:12px 13px;border-radius:12px;background:#fff;border:1px solid var(--line2);
 font-size:13px;text-align:left;margin-bottom:8px;transition:.13s;display:flex;align-items:flex-start;gap:9px;line-height:1.55;
}
.treat:active{background:#f6fafb;border-color:var(--teal-b)}
.treat .ar{color:var(--teal);font-weight:700;flex:none}
.treat.op{border-color:var(--amber-b);background:#fffdf7}

/* reports */
.rep{display:flex;align-items:center;gap:11px;padding:13px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:9px}
.rep .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--teal-l);border:1px solid var(--teal-b);flex:none}
.rep .tx{flex:1;min-width:0}
.rep .t1{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-bottom:3px}
.rep .t2{font-size:12px;color:#4d6373;line-height:1.55}

.rec{display:flex;gap:11px;padding:13px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:9px}
.rec .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.rec .tx{flex:1;min-width:0}
.rec .t1{font-size:13.5px;font-weight:600;margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec .t2{font-size:11.5px;color:var(--dim);line-height:1.6}

.up{display:flex;align-items:center;gap:11px;padding:13px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:9px}
.up .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#f2f7f9;border:1px solid var(--line);flex:none}
.up .tx{flex:1;min-width:0}
.up .t1{font-size:13.5px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.up .t2{font-size:11px;color:var(--dim);line-height:1.5}
.pips{display:flex;gap:3px;margin-left:auto}
.pips i{width:10px;height:4px;border-radius:2px;background:#e4ecf1}
.pips i.on{background:var(--teal)}
.upbtn{
 padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;flex:none;
 background:var(--teal-l);border:1px solid var(--teal-b);color:var(--teal-d);
}
.upbtn:disabled{background:#f4f7f9;border-color:var(--line);color:#aab8c2}

.empty{text-align:center;padding:44px 16px;color:var(--dim2);font-size:13px;line-height:2}
.empty .big{font-size:40px;display:block;margin-bottom:10px;opacity:.45}

/* ---------- tabbar ---------- */
.tabbar{
 flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
 box-shadow:0 -2px 12px rgba(27,42,53,.05);z-index:6;
}
.tabbar button{
 display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;
 font-size:10.5px;color:#8c9fac;transition:.15s;
}
.tabbar button .ti{font-size:18px;line-height:1;filter:grayscale(.55);opacity:.72}
.tabbar button.on{color:var(--teal-d);font-weight:600;background:var(--teal-l)}
.tabbar button.on .ti{filter:none;opacity:1}
.tabbar button:active{background:#f2f7f9}

/* ---------- modal / toast ---------- */
#toastRoot{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:120;pointer-events:none;align-items:center;width:100%;padding:0 16px}
.toast{
 padding:9px 15px;border-radius:11px;background:rgba(27,42,53,.92);color:#fff;font-size:12.5px;
 box-shadow:0 8px 24px rgba(27,42,53,.2);animation:tin .22s ease;max-width:420px;line-height:1.5;text-align:center;
}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast.ok{background:rgba(33,134,122,.95)}
.toast.bad{background:rgba(198,54,54,.95)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.28s}

.mask{position:fixed;inset:0;background:rgba(24,38,50,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:100;padding:18px}
.modal{
 width:min(480px,100%);max-height:88vh;overflow-y:auto;background:#fff;border-radius:18px;padding:22px 20px;
 box-shadow:0 24px 60px rgba(24,38,50,.28);animation:min .26s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes min{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.modal .sub{font-size:12px;color:var(--dim);margin-bottom:15px;line-height:1.6}
.modal .foot{margin-top:16px;display:flex;gap:9px}
.modal .foot .btnp{flex:1}
.res-big{font-size:19px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;gap:9px}
.res-line{font-size:13px;line-height:1.9;color:#33475a}
.res-line b{color:#12212f}
.pearl{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--teal-l);border-left:3px solid var(--teal);font-size:12.5px;line-height:1.75;color:#255e58}
.pearl .h{color:var(--teal-d);font-weight:700;font-size:11px;letter-spacing:1px;display:block;margin-bottom:5px}
.rewards{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.rw{padding:5px 11px;border-radius:9px;background:#f7fafb;border:1px solid #e8eef2;font-size:12px;color:#3c5260}
.rw.up{background:var(--green-l);border-color:var(--green-b);color:var(--green)}
.rw.dn{background:var(--red-l);border-color:var(--red-b);color:var(--red)}

/* ---------- 手术 / 抢救 ---------- */
.surg-bar{height:12px;border-radius:9px;background:#edf2f6;overflow:hidden;margin:14px 0 8px;position:relative}
.surg-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3fb8a9,#21867a);transition:width .12s linear}
.surg-bar.hot i{background:linear-gradient(90deg,#f0a04b,#d64545)}
.surg-log{font-size:12px;color:var(--dim);line-height:1.9;min-height:56px}
.surg-log div{animation:fin .2s ease}
.cd{
 font-size:34px;font-weight:800;letter-spacing:1px;text-align:center;margin:2px 0 4px;
 font-variant-numeric:tabular-nums;color:#243542;
}
.cd.hot{color:var(--red)}
.rstep{font-size:13.5px;font-weight:600;line-height:1.55;margin:6px 0 10px;color:#1b2a35}
.ropt{
 display:block;width:100%;padding:11px 13px;border-radius:11px;background:#fff;border:1px solid var(--line2);
 font-size:13px;text-align:left;margin-bottom:7px;transition:.12s;
}
.ropt:active{background:#f6fafb}
.ropt.ok{border-color:var(--green-b);background:var(--green-l);color:var(--green);font-weight:600}
.ropt.no{border-color:var(--red-b);background:var(--red-l);color:var(--red)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.dots i{width:22px;height:4px;border-radius:3px;background:#e4ecf1}
.dots i.on{background:var(--teal)}
.dots i.no{background:var(--red)}
</style>
<meta name="theme-color" content="#153e46"><link rel="stylesheet" href="hospital.css"></head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo">✚</div>
    <div class="hdr-t">
      <b>仁心医院</b>
      <small id="hdrSub">内科 · 第 1 天 · 实习医师</small>
    </div>
    <div class="hdr-r">
      <div class="chip2">💰<b id="hCash" class="mono">¥0</b></div>
      <div class="chip2 rep">⭐<b id="hRep" class="mono">50</b></div>
      <button class="icon-btn" onclick="switchTab('save')" title="存档与设置">⏏</button>
    </div>
  </header>

  <div class="duty-strip"></div><main class="content" id="content"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="overview" onclick="switchTab('overview')"><span class="ti">🏠</span><span>值班大厅</span></button>
    <button data-tab="clinic" onclick="switchTab('clinic')"><span class="ti">🩺</span><span>门诊诊室</span></button>
    <button data-tab="reports" onclick="switchTab('reports')"><span class="ti">📄</span><span>医技中心</span></button>
    <button data-tab="records" onclick="switchTab('records')"><span class="ti">📁</span><span>病历档案</span></button>
    <button data-tab="dept" onclick="switchTab('dept')"><span class="ti">⚙️</span><span>医务办公</span></button>
    <button data-tab="save" onclick="switchTab('save')"><span class="ti">💾</span><span>存档设置</span></button>
  </nav>
</div>

<div id="toastRoot"></div>
<div id="modalRoot"></div>

<script>
/* ---------------- 检查项目库 ---------------- */
const TESTS = [
  {id:'cbc',    name:'血常规',        cost:35,  min:20, ico:'🩸'},
  {id:'bio',    name:'生化全套',      cost:120, min:40, ico:'🧪'},
  {id:'trop',   name:'心肌标志物',    cost:180, min:30, ico:'❤️'},
  {id:'ecg',    name:'心电图',        cost:30,  min:10, ico:'📈'},
  {id:'cxr',    name:'胸部X线',       cost:80,  min:20, ico:'🫁'},
  {id:'ct',     name:'胸部CT',        cost:420, min:45, ico:'🖥'},
  {id:'headct', name:'头颅CT',        cost:380, min:30, ico:'🧠'},
  {id:'us',     name:'腹部超声',      cost:160, min:25, ico:'🔊'},
  {id:'urine',  name:'尿常规',        cost:25,  min:20, ico:'🧫'},
  {id:'gas',    name:'动脉血气',      cost:90,  min:15, ico:'💨'},
  {id:'ddimer', name:'D-二聚体+凝血', cost:150, min:40, ico:'🩹'},
  {id:'glu',    name:'快速血糖',      cost:15,  min:5,  ico:'🍬'},

function poolByDept(){
  const d = DEPTS.find(x=>x.id===S.dept) || DEPTS[0];
  const main = DISEASES.filter(x=>d.keys.indexOf(x.dept)>=0);
  const rest = DISEASES.filter(x=>d.keys.indexOf(x.dept)<0);
  const maxDiff = 2 + S.rank;
  const okMain = main.filter(x=>x.diff<=maxDiff);
  const okRest = rest.filter(x=>x.diff<=maxDiff);
  return {main: okMain.length?okMain:main, rest: okRest.length?okRest:rest};
}

function makePatient(){
  const p2 = poolByDept();
  const d = (Math.random()<0.78 || p2.rest.length===0) ? pick(p2.main) : pick(p2.rest);
  const sex = d.sex || (Math.random()<0.52?'女':'男');
  const age = d.age || (d.id==='cap'?ri(18,72):d.id==='copd'?ri(56,80):ri(22,76));
  const v = Object.assign({}, d.vitals);
  v.T = (parseFloat(v.T)+rnd(-0.2,0.2)).toFixed(1);
  v.P = String(Math.round(parseFloat(v.P)+rnd(-4,4)));
  v.R = String(Math.round(parseFloat(v.R)+rnd(-1,1)));
  v.SpO2 = String(Math.min(99,Math.max(82,Math.round(parseFloat(v.SpO2)+rnd(-1,1)))));
  const bp = v.BP.split('/');
  v.BP = Math.round(parseFloat(bp[0])+rnd(-6,6))+'/'+Math.round(parseFloat(bp[1])+rnd(-4,4));

  const p = {
    id:'P'+(S.seq++), name:randName(sex), sex:sex, age:age, dis:d.id, cc:d.cc,
    vitals:v, hIdx:0, sIdx:0, tests:{}, dxTries:0, ruled:[], options:null,
    phase:'work', done:false, cost:0
  };
  S.patients[p.id]=p;
  return p;
}
function randName(sex){
  const sn='赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜';
  const gn = sex==='女' ? ['芳','娜','敏','静','丽','艳','娟','秀英','霞','玉兰','雨欣','梦琪','慧','颖']
                        : ['伟','强','磊','洋','勇','杰','涛','明','超','建国','鹏','晨','浩','鑫'];
  return sn[Math.floor(Math.random()*sn.length)] + pick(gn);
}

function caseOptions(p){
  if(p.options) return p.options;
  const d = DIS_MAP[p.dis];
  const same = shuffle(DISEASES.filter(x=>x.dept===d.dept && x.id!==d.id).map(x=>x.name));
  const other = shuffle(DISEASES.filter(x=>x.dept!==d.dept).map(x=>x.name));
  let pool = same.slice(0,3);
  while(pool.length<5){ const n=other.pop(); if(!n) break; if(pool.indexOf(n)<0) pool.push(n); }
  p.options = shuffle(pool.concat([d.name]));
  return p.options;
}

function vitalAbn(v){
  const o={};
  const t=parseFloat(v.T); if(t>=37.3) o.T=t>=38.5?2:1; if(t<=36.0) o.T=1;
  const p=parseFloat(v.P); if(p>100||p<60) o.P=(p>120||p<50)?2:1;
  const r=parseFloat(v.R); if(r>20||r<12) o.R=(r>28||r<10)?2:1;
  const sp=parseFloat(v.SpO2); if(sp<95) o.SpO2=sp<90?2:1;
  const bp=v.BP.split('/'), sys=parseFloat(bp[0]), dia=parseFloat(bp[1]);
  if(sys>=140||sys<90) o.BP=(sys>=180||sys<85)?2:1;
  if(dia>=90) o.BP=Math.max(o.BP||0,1);
  return o;
}

/* ---------------- 检查 ---------------- */
function testCost(t){
  const lv = S.up.lab;
  const isImg = (t.id==='ct'||t.id==='headct'||t.id==='cxr'||t.id==='us');
  let cost = t.cost*(1-0.08*lv);
  let min = t.min*(1-0.12*lv);
  if(isImg){ cost *= (1-0.06*S.up.img); min *= (1-0.15*S.up.img); }
  return {cost:Math.round(cost), min:Math.max(2,Math.round(min*0.4))};
}
function doTest(tid){
  const p=S.patients[S.active]; if(!p) return;
  if(p.tests[tid]) return;
  const t=TEST_MAP[tid]; if(!t) return;
  const c=testCost(t);
  if(S.cash < c.cost){ toast('现金不足，开不了这项检查','bad'); return; }
  S.cash -= c.cost; S.today.cost += c.cost; p.cost += c.cost;
  const d=DIS_MAP[p.dis];
  p.tests[tid] = {res: d.t[tid] || '未见明显异常', cost:c.cost};
  advanceClock(c.min);
  render(); save();
}
function consult(){
  const p=S.patients[S.active]; if(!p) return;
  if(p.ruled.length>=2) return;
  if(S.cash<400){ toast('现金不足，无法请上级会诊','bad'); return; }
  S.cash-=400; S.today.cost+=400; p.cost+=400;
  const d=DIS_MAP[p.dis];
  const opts=caseOptions(p).filter(o=>o!==d.name && p.ruled.indexOf(o)<0);
  const rm=shuffle(opts).slice(0,2);
  p.ruled=p.ruled.concat(rm);
  advanceClock(10);
  toast('👨‍⚕️ 上级会诊：已排除 2 项鉴别诊断','ok');
  render(); save();
}

/* ---------------- 抢救（限时决策） ---------------- */
function buildRescueSteps(p){
  const v=p.vitals, steps=[];
  const sys=parseFloat(v.BP.split('/')[0]), spo=parseFloat(v.SpO2), hr=parseFloat(v.P), temp=parseFloat(v.T);
  if(sys<95) steps.push({q:'患者血压 '+v.BP+' mmHg，循环不稳，首要处置是？',
    o:[['快速静脉补液扩容，必要时升压药',1],['立即静脉降压',0],['限制入量，先观察',0]]});
  if(spo<93) steps.push({q:'血氧饱和度仅 '+v.SpO2+'%，首要处置是？',
    o:[['开放气道、高流量吸氧/无创通气',1],['给予镇静药减少氧耗',0],['平卧休息并观察',0]]});
  if(hr>115) steps.push({q:'心率 '+v.P+' 次/分，首要处置是？',
    o:[['评估心律，血流动力学不稳时同步电复律',1],['静脉推注地塞米松',0],['按压颈动脉窦并观察',0]]});
  if(temp>=38.3) steps.push({q:'体温 '+v.T+'℃，首要处置是？',
    o:[['留取血培养后 1 小时内启动广谱抗生素',1],['单纯物理降温后等待',0],['先等培养结果再用抗生素',0]]});
  while(steps.length<3) steps.push({q:'气道与体位管理，下列哪项正确？',
    o:[['仰头抬颏、清除口鼻分泌物，侧卧防误吸',1],['立即喂水观察',0],['垫高下肢并取坐位',0]]});
  return steps.slice(0,3).map(function(s){
    return {q:s.q, o:shuffle(s.o.map(function(x){ return {l:x[0], ok:!!x[1]}; }))};
  });
}

function startRescue(p, txOpt){
  const steps = buildRescueSteps(p);
  const LIMIT = 100;           // 10 秒
  let left = LIMIT, idx = 0, locked = false, done = false, pen = 0;

  function mount(){
    let dots='';
    for(let i=0;i<steps.length;i++){
      dots += '<i class="'+(i<idx?'on':'')+'"></i>';
    }
    $('modalRoot').innerHTML =
      '<div class="mask"><div class="modal">'
      + '<h3>🚨 抢救中 · ' + p.name + '</h3>'
      + '<div class="sub">' + p.sex + ' · ' + p.age + ' 岁 ｜ 生命体征不稳，请迅速判断</div>'
      + '<div class="dots">' + dots + '</div>'
      + '<div class="cd" id="cdNum">' + (left/10).toFixed(1) + 's</div>'
      + '<div class="surg-bar hot"><i id="cdBar" style="width:100%"></i></div>'
      + '<div class="rstep" id="rsQ">' + steps[idx].q + '</div>'
      + '<div id="rsOpts">' + steps[idx].o.map(function(o,i){
          return '<button class="ropt" data-i="'+i+'" onclick="__pickRescue('+i+')">'+o.l+'</button>';
        }).join('') + '</div>'
      + '</div></div>';
  }

  window.__pickRescue = function(i){
    if(locked || done) return;
    const opt = steps[idx].o[i];
    if(!opt) return;
    if(opt.ok){
      locked = true;
      const btn = document.querySelector('.ropt[data-i="'+i+'"]');
      if(btn) btn.classList.add('ok');
      idx++;
      if(idx >= steps.length){
        done = true;
        clearInterval(iv);
        setTimeout(function(){
          $('modalRoot').innerHTML='';
          finishCase(p, txOpt, null, {rescue:true});
        }, 420);
      } else {
        setTimeout(function(){ locked=false; mount(); }, 260);
      }
    } else {
      left = Math.max(0, left - 35);
      pen++;
      const btn = document.querySelector('.ropt[data-i="'+i+'"]');
      if(btn){ btn.classList.add('no'); setTimeout(function(){ btn.classList.remove('no'); }, 420); }
      if(left <= 0){ fail(); }
    }
  };

  function fail(){
    if(done) return;
    done = true;
    clearInterval(iv);
    $('modalRoot').innerHTML='';
    finishCase(p, txOpt, 'rescue');
  }

  mount();

  const iv = setInterval(function(){
    if(done) return;
    left -= 1;
    const n=$('cdNum'), b=$('cdBar');
    if(n){ n.textContent = Math.max(0,left/10).toFixed(1)+'s'; if(left<40) n.classList.add('hot'); }
    if(b) b.style.width = Math.max(0,left)+'%';
    if(left<=0) fail();
  }, 100);
}

/* ---------------- 结算 ---------------- */
function finishCase(p, txOpt, failReason, extra){
  const d = DIS_MAP[p.dis];
  const rankMul = RANKS[S.rank].mul;
  const tired = S.health < 25 ? 0.85 : 1;
  let income=0, repD=0, expD=0, result='', detail='', okState='bad';

  if(failReason==='dx'){
    repD = -6; expD = Math.round(d.exp*0.15);
    result = '⚠️ 病例失控';
    detail = '连续三次诊断不成立，患者转上级医院，科室声誉受损。';
  } else if(failReason==='rescue'){
    if(d.critical) S.today.death++, S.total.death++;
    repD = -8; expD = Math.round(d.exp*0.2);
    result = '💔 抢救失败';
    detail = '抢救窗口内未能完成关键处置，患者病情不可逆恶化。';
    S.today.dispute++; S.total.dispute++;
  } else if(txOpt && txOpt.ok){
    income = d.fee * rankMul * tired;
    if(d.critical) { income *= 1.3; repD += 4; } else repD += 2;
    expD = d.exp;
    S.today.cured++; S.total.cured++; S.acad += 1;
    result = '✅ 诊疗成功'; okState='ok';
    detail = '诊断准确、处置得当，患者病情稳定，家属表示感谢。';
  } else {
    income = d.fee * rankMul * 0.55 * tired;
    repD = -1; expD = Math.round(d.exp*0.5);
    S.today.cured++;
    result = '🟡 处置欠妥'; okState='mid';
    detail = '诊断方向正确，但处置方案不够恰当，患者病情出现反复。';
  }

  p.done = true;
  S.cash += income; S.today.income += income; S.total.income += income;
  S.today.seen++; S.total.seen++;
  S.rep = Math.max(0, Math.min(100, S.rep + repD));
  S.exp += expD;
  S.health = Math.max(0, S.health - (5 + d.diff*2));

  const qi = S.queue.indexOf(p.id); if(qi>=0) S.queue.splice(qi,1);
  S.active = null; S.sel = null;

  S.history.unshift({
    day:S.day, name:p.name, sex:p.sex, age:p.age, dept:d.dept,
    dx:d.name, result:result, ok: (result.indexOf('✅')===0),
    income:Math.round(income), crit:!!d.critical
  });
  if(S.history.length>60) S.history.length=60;

  const nr = rankOf(S.exp);
  if(nr!==S.rank){ S.rank=nr; setTimeout(function(){ toast('🎖 晋升：'+RANKS[nr].name+'！收入系数 ×'+RANKS[nr].mul,'ok'); },700); }

  showResult(p, d, result, detail, income, repD, expD, okState);
  render(); save();
}

/* ---------------- 升级 / 科研 ---------------- */
function buyUp(k){
  const u=UP_MAP[k], lv=S.up[k];
  if(lv>=u.max) return;
  const c=u.cost[lv];
  if(S.cash<c){ toast('现金不足，需要 '+fmtY(c),'bad'); return; }
  S.cash-=c; S.today.cost+=c; S.up[k]=lv+1;
  toast('🏗 '+u.name+' 升级至 Lv.'+(lv+1),'ok');
  render(); save();
}
function publishPaper(){
  if(S.acad<8){ toast('学术点不足（需 8 点，当前 '+S.acad+'）','bad'); return; }
  if(S.cash<2000){ toast('科研经费不足（需 ¥2,000）','bad'); return; }
  S.acad-=8; S.cash-=2000; S.papers++;
  S.rep=Math.min(100,S.rep+6); S.exp+=150;
  const nr=rankOf(S.exp); if(nr!==S.rank){ S.rank=nr; toast('🎖 晋升：'+RANKS[nr].name,'ok'); }
  else toast('📄 发表论文 1 篇！声誉 +6，经验 +150','ok');

}
function drinkCoffee(){
  if(S.cash<80){ toast('现金不足','bad'); return; }

      h+='<span class="ar">'+(op?'🔪':'▸')+'</span><span style="flex:1">'+t.l+'</span></button>';
    });
    h+='<div style="font-size:11px;color:var(--dim2);line-height:1.6;margin-top:4px">含手术/抢救操作的方案会进入限时处置，请做好准备</div>';
    h+='</div>';
  }
  return h;
}

/* ---- 检查报告 ---- */
function pgReports(){
  let h='<div class="pg-title">检查报告</div>';
  h+='<div class="pg-sub">查看所有已返回的化验、影像与功能检查结果</div>';
  const p = S.active ? S.patients[S.active] : null;
  if(!p){
    h+='<div class="card"><div class="empty"><span class="big">📄</span>当前没有正在接诊的患者<br><span style="font-size:12px">接到患者后开立的检查会显示在这里</span></div></div>';
    return h;
  }
  const d = DIS_MAP[p.dis];
  const keys = Object.keys(p.tests);
  h+='<div class="card tight" style="background:#f9fbfc">';
  h+='<div style="display:flex;align-items:center;gap:9px">';
  h+='<div class="av" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:16px">'+(p.sex==='女'?'👩':'👨')+'</div>';
  h+='<div style="flex:1"><div style="font-size:13.5px;font-weight:600">'+p.name+' · '+p.sex+' · '+p.age+'岁</div>';
  h+='<div style="font-size:11px;color:var(--dim)">'+p.id+' ｜ '+d.dept+' ｜ 共 '+keys.length+' 项报告</div></div></div></div>';

  if(keys.length===0){
    h+='<div class="card"><div class="empty"><span class="big">🧪</span>尚未开立任何检查<br><span style="font-size:12px">回「诊室接诊」开单</span></div></div>';
    return h;
  }
  keys.forEach(function(k){
    const t = TEST_MAP[k], r = p.tests[k];
    const urgent = /↑|↓|\+\+\+|缺损|抬高|增宽|实变|积液|出血|破|消失|阳性|压缩|畸形|异常/.test(r.res);
    h+='<div class="rep">';
    h+='<div class="ic">'+t.ico+'</div>';
    h+='<div class="tx"><div class="t1">'+t.name+(urgent?'<span class="badge r">异常</span>':'<span class="badge g">未见异常</span>')+'</div>';
    h+='<div class="t2">'+r.res+'</div></div></div>';
  });
  h+='<button class="btno" style="margin-top:6px" onclick="switchTab(\'clinic\')">‹ 返回诊室</button>';
  return h;
}

/* ---- 病历档案 ---- */
function pgRecords(){
  let h='<div class="pg-title">病历档案</div>';
  h+='<div class="pg-sub">已完成病例的诊疗记录与结局</div>';
  if(S.history.length===0){
    h+='<div class="card"><div class="empty"><span class="big">📁</span>暂无病历记录<br><span style="font-size:12px">完成第一例诊疗后会出现在这里</span></div></div>';
    return h;
  }
  const okCnt = S.history.filter(function(x){ return x.ok; }).length;
  h+='<div class="card tight" style="display:flex;gap:14px;text-align:center">';
  h+='<div style="flex:1"><div style="font-size:18px;font-weight:700">'+S.history.length+'</div><div style="font-size:11px;color:var(--dim)">总病例</div></div>';
  h+='<div style="flex:1;border-left:1px solid var(--line);border-right:1px solid var(--line)"><div style="font-size:18px;font-weight:700;color:var(--green)">'+okCnt+'</div><div style="font-size:11px;color:var(--dim)">诊疗成功</div></div>';
  h+='<div style="flex:1"><div style="font-size:18px;font-weight:700;color:var(--red)">'+(S.history.length-okCnt)+'</div><div style="font-size:11px;color:var(--dim)">失败/欠妥</div></div>';
  h+='</div>';
  S.history.forEach(function(r){
    const col = r.ok ? '#2f9e63' : (r.result.indexOf('🟡')===0 ? '#c07a1a' : '#d64545');
    h+='<div class="rec">';
    h+='<div class="dot" style="background:'+col+'"></div>';
    h+='<div class="tx"><div class="t1">'+r.name+' <span style="font-weight:400;color:var(--dim);font-size:11.5px">'+r.sex+' · '+r.age+'岁</span>'
      +(r.crit?'<span class="badge r" style="font-size:9.5px">危重</span>':'')
      +'<span style="margin-left:auto;font-size:11px;color:var(--dim)">第 '+r.day+' 天</span></div>';
    h+='<div class="t2">诊断：'+r.dx+'<br>结局：<span style="color:'+col+'">'+r.result+'</span> ｜ 收入 '+fmtY(r.income)+'</div></div></div>';
  });
  return h;
}

/* ---- 科室设置 ---- */
function pgDept(){
  let h='<div class="pg-title">科室设置</div>';
  h+='<div class="pg-sub">升级设备与团队，提升效率与危重症救治能力</div>';
  UPS.forEach(function(u){
    const lv=S.up[u.k], max=lv>=u.max, c=max?0:u.cost[lv];
    h+='<div class="up">';
    h+='<div class="ic">'+u.ico+'</div>';
    h+='<div class="tx"><div class="t1">'+u.name+'<span style="font-size:10.5px;color:var(--dim2);font-weight:400">Lv.'+lv+'</span>';
    h+='<span class="pips">';
    for(let i=0;i<u.max;i++) h+='<i class="'+(i<lv?'on':'')+'"></i>';
    h+='</span></div><div class="t2">'+u.desc+'</div></div>';
    h+='<button class="upbtn" onclick="buyUp(\''+u.k+'\')"'+(max||S.cash<c?' disabled':'')+'>'+(max?'满级':fmtY(c))+'</button>';
    h+='</div>';
  });
  h+='<div class="up" style="border-color:#d9cef0;background:#fbfaff">';
  h+='<div class="ic" style="background:#f3effc;border-color:#e2d9f7">📄</div>';
  h+='<div class="tx"><div class="t1">科研论文<span style="font-size:10.5px;color:var(--dim2);font-weight:400">已发表 '+S.papers+' 篇</span></div>';
  h+='<div class="t2">消耗 8 学术点 + ¥2,000，声誉 +6、经验 +150（当前学术点 '+S.acad+'）</div></div>';
  h+='<button class="upbtn" onclick="publishPaper()"'+(S.acad<8||S.cash<2000?' disabled':'')+'>发表</button>';
  h+='</div>';
  h+='<div class="card" style="margin-top:12px"><div class="card-h"><span class="ico">🪪</span>职称与收入</div>';
  RANKS.forEach(function(r,i){
    const on = i===S.rank;
    h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #edf2f6;font-size:12.5px">';
    h+='<span style="color:'+(on?'var(--teal)':'var(--dim2)')+'">'+(on?'●':'○')+'</span>';
    h+='<span style="'+(on?'font-weight:700;color:var(--teal-d)':'color:#5d7385')+'">'+r.name+'</span>';
    h+='<span style="margin-left:auto;color:var(--dim)">经验 '+r.exp+' ｜ 收入 ×'+r.mul+'</span></div>';
  });
  h+='</div>';
  return h;
}

/* ---- 存档设置 ---- */
function pgSave(){
  let h='<div class="pg-title">存档设置</div>';
  h+='<div class="pg-sub">游戏进度自动保存在本机浏览器，可手动存档或重新开始</div>';
  h+='<div class="card"><div class="card-h"><span class="ico">💾</span>当前进度</div>';
  h+='<div style="font-size:12.5px;line-height:2.1;color:#3c5260">';
  h+='科室：<b>'+deptLabel()+'</b><br>';
  h+='第 <b>'+S.day+'</b> 天 ｜ 职称 <b>'+RANKS[S.rank].name+'</b><br>';
  h+='累计接诊 <b>'+S.total.seen+'</b> 例 ｜ 声誉 <b>'+Math.round(S.rep)+'</b><br>';
  h+='现金 <b>'+fmtY(S.cash)+'</b> ｜ 绩效 <b>'+fmtY(S.total.income)+'</b>';
  h+='</div></div>';
  h+='<button class="btnp" onclick="doSave()">手动存档</button>';
  h+='<div style="height:9px"></div>';
  h+='<button class="btno" onclick="doReset()">清空存档 · 重新选择科室</button>';
  h+='<div class="card" style="margin-top:14px"><div class="card-h"><span class="ico">📖</span>玩法说明</div>';
  h+='<div style="font-size:12.5px;line-height:1.95;color:#3c5260">';
  h+='· 每天 8 个号源，点「现场挂号」叫号，再进诊室接诊<br>';
  h+='· 按 问诊 → 查体 → 检查 → 诊断 → 处置 的顺序收集线索<br>';
  h+='· 时间只随操作推进，不会自动流逝，可从容判断<br>';
  h+='· 危重患者处置时会进入<b>限时抢救</b>，手术会播放<b>读条</b><br>';
  h+='· 误诊扣声誉，连续三次误诊病例失控；上级会诊可排除 2 项<br>';
  h+='· 现金用于检查、升级与科研；精力过低会降低收入';
  h+='</div></div>';
  return h;
}
function doSave(){ save(); toast('已存档','ok'); }
function doReset(){
  $('modalRoot').innerHTML =
    '<div class="mask"><div class="modal">'
    + '<h3>重新开始？</h3><div class="sub">将清空当前所有进度，重新选择科室</div>'
    + '<div class="foot"><button class="btno" onclick="closeModal()">取消</button>'
    + '<button class="btnp" onclick="hardReset()">确认清空</button></div></div></div>';
}
function hardReset(){
  localStorage.removeItem(SAVE_KEY);
  S = null;
  $('modalRoot').innerHTML='';
  showDeptSelect(true);
}

/* ---------------- 选择科室 ---------------- */
function showDeptSelect(isReset){
  let h='<div class="mask" style="align-items:flex-start;padding-top:32px"><div class="modal" style="max-height:82vh">';
  h+='<img class="onboard-art" src="assets/consultation.webp" alt="仁心医院门诊诊室"><h3>✚ 仁心医院 · 入职登记</h3>';
  h+='<div class="sub">'+(isReset?'重新选择科室':'选择你的科室')+'<br>不同科室拥有专属病例库与常见病种，开局身份为实习医师。</div>';
  DEPTS.forEach(function(d){
    h+='<button class="card" style="width:100%;text-align:left;margin-bottom:10px;display:block" onclick="chooseDept(\''+d.id+'\')">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">';
    h+='<div style="width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--teal-l);border:1px solid var(--teal-b);font-size:17px">'+d.ico+'</div>';
    h+='<div style="font-size:15px;font-weight:700">'+d.name+'</div></div>';
    h+='<div style="font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:9px">'+d.desc+'</div>';
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
    d.tags.forEach(function(t){ h+='<span class="badge t">'+t+'</span>'; });
    h+='</div></button>';
  });
  h+='<div style="font-size:11px;color:var(--dim2);text-align:center;line-height:1.7">本游戏仅供娱乐，不构成任何医疗建议<br>所有病例与诊疗方案均为模拟内容</div>';
  h+='</div></div>';
  $('modalRoot').innerHTML = h;
}
function chooseDept(id){
  const keep = S && S.total ? S.total : null;
  S = newGame(id);
  if(keep && keep.seen>0){ /* 重置不继承 */ }
  $('modalRoot').innerHTML='';
  S.today.slots = 8;
  render(); save();
  toast('欢迎来到'+deptLabel()+'，开始第一天的门诊','ok');
}

/* ---------------- 启动 ---------------- */
function boot(){
  const saved = load();
  if(saved){
    S = saved;
    if(!S.history) S.history=[];
    if(typeof S.health!=='number') S.health=100;
    if(!S.tab) S.tab='overview';
    render();
  } else {
    S = newGame('im');
    S.tab='overview';
    render();
    showDeptSelect(false);
  }
}
window.addEventListener('beforeunload', save);
boot();
</script>
