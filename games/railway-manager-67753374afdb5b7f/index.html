<head>
<meta charset="UTF-8">

<title>铁路规划模拟器 v1.2.0</title>
<style>
  :root{
    --bg:#f2f5f3; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --green:#16a34a; --green-bg:#ecfdf3; --red:#dc2626; --blue:#2563eb; --blue-bg:#eff6ff;
    --amber:#d97706; --amber-bg:#fffbeb; --purple:#7c3aed;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:70px}
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .brand{font-weight:800;font-size:16px}
  .brand .ver{font-size:10px;color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .clock{font-variant-numeric:tabular-nums;background:var(--green-bg);color:var(--green);border-radius:10px;padding:5px 12px;font-weight:700}
  .speed{display:flex;gap:4px}
  .speed button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:700;color:var(--sub)}
  .speed button.on{background:var(--green);border-color:var(--green);color:#fff}
  .cash{margin-left:auto;font-weight:800;color:var(--green);font-size:16px;font-variant-numeric:tabular-nums}
  .cash.neg{color:var(--red)}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{border:0;background:none;font-size:12px;color:var(--sub);cursor:pointer;padding:4px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button .ic{font-size:18px}
  nav button.on{color:var(--green);font-weight:700;background:var(--green-bg)}
  main{max-width:860px;margin:14px auto;padding:0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .card h4{font-size:13px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .big{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .small{font-size:12px;color:var(--sub);margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)} .blue{color:var(--blue)} .amber{color:var(--amber)}
  .tag{font-size:11px;border-radius:8px;padding:2px 8px;font-weight:600;white-space:nowrap}
  .tag.g{background:var(--green-bg);color:var(--green)} .tag.b{background:var(--blue-bg);color:var(--blue)}
  .tag.a{background:var(--amber-bg);color:var(--amber)} .tag.r{background:#fef2f2;color:var(--red)} .tag.gr{background:#f3f4f6;color:var(--sub)}
  .btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;background:var(--green);color:#fff}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.red{background:#fee2e2;color:var(--red)}
  .btn.blue{background:var(--blue)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .sect{margin:18px 0 10px;font-weight:800;font-size:15px}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .row .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .name{font-weight:800;font-size:15px}
  .row .meta{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.7}
  .stations{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .st{font-size:11px;background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:#475569}
  .prog{height:7px;background:#eef2f0;border-radius:5px;margin-top:8px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:5px;transition:width .3s}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px}
  .modal h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .modal .x{cursor:pointer;border:0;background:#f3f4f6;border-radius:8px;width:26px;height:26px;font-size:14px}
  .opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer}
  .opt:hover{border-color:var(--green)}
  .opt.sel{border-color:var(--green);background:var(--green-bg)}
  select,input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;width:100%;background:#fff;color:var(--ink)}
  label.lb{font-size:12px;color:var(--sub);font-weight:700;display:block;margin:12px 0 5px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  #toasts{position:fixed;top:64px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px}
  .toast{background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:fin .25s;line-height:1.5}
  .toast.ok{background:#065f46}.toast.bad{background:#7f1d1d}
  @keyframes fin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:13px}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .r1{color:var(--red)}.r2{color:#ea580c}.r3{color:var(--amber)}.r4{color:#65a30d}.r5{color:var(--green)}
  .banner{background:linear-gradient(120deg,#312e81,#4c1d95 60%,#5b21b6);color:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .banner .t{font-weight:800;font-size:15px}
  .banner p{font-size:12px;opacity:.85;margin:8px 0 12px;line-height:1.7}

let saveLocked=false,saveRev=0;
function validState(d){
 validateSchedule12(d);
 if(!d||typeof d!=='object'||!Number.isFinite(d.cash)||Math.abs(d.cash)>1e15||!Number.isInteger(d.T)||d.T<0||!Number.isInteger(d.day)||d.day!==Math.floor(d.T/1440)+1||!Number.isFinite(d.loans)||d.loans<0||!d.ids||!d.lines||!d.comm||!d.stats)throw Error('存档结构无效');
 for(const k of ['svc','train','staff'])if(!Number.isInteger(d.ids[k])||d.ids[k]<0)throw Error('编号无效');
 for(const k of ['income','cost','trips','onTime','arrived'])if(!Number.isFinite(d.stats[k])||d.stats[k]<0)throw Error('统计无效');
 if(![d.trains,d.staff,d.services].every(Array.isArray)||d.trains.length>500||d.services.length>3000||d.staff.length>3000)throw Error('内容超出范围');
 if(d.trains.some(t=>!MODELS.some(m=>m.id===t.modelId)||!Number.isInteger(t.uid)||!Number.isFinite(t.freeAt)))throw Error('车辆数据无效');
 if(new Set(d.trains.map(t=>t.uid)).size!==d.trains.length)throw Error('车辆编号重复');
 if(d.staff.some(p=>!ROLES.some(r=>r.id===p.role)||!Number.isInteger(p.id)||typeof p.name!=='string'||!/^[\u3400-\u9fffA-Za-z· ]{1,24}$/.test(p.name)))throw Error('人员数据无效');
 if(d.services.some(x=>!d.trains.some(t=>t.uid===x.trainUid)||!LINES.some(l=>l.id===x.lineId)||!['wait','running','done'].includes(x.status)||!Number.isInteger(x.depMin)||x.depMin<0||x.depMin>=1440||!/^sv\d+$/.test(x.id)||!/^\w{1,14}$/.test(x.code)||x.status==='running'&&(!Number.isFinite(x.arriveAbs)||!Number.isFinite(x.depAbs))))throw Error('班次数据无效');
 for(const c of COMMS)if(!Number.isInteger(d.comm[c.id]||0)||(d.comm[c.id]||0)<0||(d.comm[c.id]||0)>5)throw Error('商业等级无效');
 if(d.ops){if(!Number.isFinite(d.ops.rep)||d.ops.rep<0||d.ops.rep>100||!Number.isFinite(d.ops.totalPax)||d.ops.totalPax<0||!Array.isArray(d.ops.claimed)||!Array.isArray(d.ops.log))throw Error('经营数据无效');d.ops.log=d.ops.log.filter(x=>typeof x==='string'&&!/[<>]/.test(x)).slice(0,12);d.ops.claimed=d.ops.claimed.filter(x=>Number.isInteger(x)&&x>=0&&x<12);d.ops.case=Math.max(0,Math.min(24,Number(d.ops.case)||0));d.ops.fare=['value','normal','premium'].includes(d.ops.fare)?d.ops.fare:'normal';}
 d.speed=0;return d;
}
function save(){if(saveLocked||!S)return;try{saveRev=Math.max(Date.now(),saveRev+1);localStorage.setItem(KEY,JSON.stringify({game:'G207',version:'1.2.0',rev:saveRev,state:S}));}catch(e){if(!window.storageWarned){window.storageWarned=true;toast('存储空间不可用，请导出存档保留进度','bad');}}}
function load(){try{let raw=localStorage.getItem(KEY),legacy=false;if(!raw){raw=localStorage.getItem(LEGACY_KEY);legacy=true;}if(!raw)return false;const p=JSON.parse(raw);S=validState(p.state||p);if(S.scheduleSchema!==2)localStorage.setItem(KEY+'_before_v1.2.0',raw);migrateSchedule12(S);saveRev=p.rev||0;if(legacy)localStorage.setItem(KEY+'_legacy_backup',raw);return true;}catch(e){toast('存档损坏，原数据已保留。可在管理页导入备份。','bad');return false;}}
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const p=JSON.parse(e.newValue);if(p.rev>saveRev){saveLocked=true;S.speed=0;openExternal();}}catch{}}});
function openExternal(){modalOpen=true;$('modalRoot').innerHTML='<div class="modal-mask"><div class="modal"><h3>另一页面已有更新</h3><p class="small">已暂停本页写入，防止覆盖更新的进度。可以先导出当前进度，再载入最新存档。</p><div class="flex" style="margin-top:14px"><button class="btn" onclick="exportSave()">导出本页进度</button><button class="btn sec" onclick="location.reload()">载入最新</button></div></div></div>';}
function exportSave(){const b=new Blob([JSON.stringify({game:'G207',version:'1.2.0',state:S},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='铁路规划模拟器-第'+S.day+'天.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function importSave(file){if(!file||saveLocked)return;if(file.size>2000000){toast('存档文件过大','bad');return;}file.text().then(raw=>{try{const p=JSON.parse(raw);if(p.game&&p.game!=='G207')throw Error('不属于本游戏');const d=validState(p.state||p);if(!confirm('导入后替换本页进度，当前进度将自动留一份本机备份。继续？'))return;localStorage.setItem(KEY+'_before_import',JSON.stringify(S));S=d;migrateSchedule12(S);initOps();save();closeModal();renderClock();renderView();toast('存档已导入，当前已暂停','ok');}catch(e){toast('导入失败：'+e.message+'，当前进度未变','bad');}});}

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function fmt(v){
 const a=Math.abs(v);
 if(a>=1e8)return (v/1e8).toFixed(2)+' 亿';
 if(a>=1e4)return (v/1e4).toFixed(1)+' 万';
 return Math.round(v)+' 元';
}
function fmtY(v){return '¥'+fmt(v);}
function lineOf(id){return LINES.find(l=>l.id===id);}
function modelOf(id){return MODELS.find(m=>m.id===id);}
function trainOf(uid){return S.trains.find(t=>t.uid===uid);}
function staffCount(role){return S.staff.filter(s=>s.role===role).length;}
function toast(msg,cls){
 const box=$('toasts');const el=document.createElement('div');
 el.className='toast'+(cls?' '+cls:'');el.innerHTML=msg;box.appendChild(el);
 while(box.children.length>4)box.removeChild(box.firstChild);
 setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},5200);
}
function durMin(line,model){ // 单程时长（分钟）
 const stops=line.stations.length;
 return Math.round(line.len/model.speed*60 + stops*4);
}
function lfBase(){return 0.55+ (Math.random()*0.24-0.12);}
function commBonusPerPax(){
 return COMMS.reduce((s,c)=>s+c.per*(S.comm[c.id]||0),0);
}
function netAssets(){
 const fleet=S.trains.reduce((s,t)=>s+modelOf(t.modelId).price*0.7,0);
 return S.cash+fleet-S.loans;
}
function runningNeed(){
 let need={hdriver:0,kdriver:0,crew:0};
 S.services.forEach(sv=>{
  if(sv.status==='running'){
   const m=modelOf(trainOf(sv.trainUid).modelId);
   if(m.speed>=200)need.hdriver++;else need.kdriver++;
   need.crew+=Math.ceil(m.seats/300);
  }
 });
 return need;
}
function breakdownRisk(){
 return Math.max(0.005, 0.03-0.006*staffCount('engineer'));
}

/* ================= 核心模拟 ================= */
function tick(){
 if(S.speed===0)return;
 for(let i=0;i<S.speed;i++){S.T++;minuteStep();}
 renderClock();
}
function minuteStepLegacy(){
 const day=Math.floor(S.T/1440)+1;
 if(day!==S.day){S.day=day;newDay();}
 const tod=S.T%1440;
 S.services.forEach(sv=>{
  if(sv.status==='wait'&&tod>=sv.depMin&&sv.depDay!==S.day){
   if(tod-sv.depMin>90){sv.depDay=S.day;sv.status='done';toast('⚠️ '+sv.code+' 因资源不足今日停运');return;}
   tryDepart(sv);
  }
  if(sv.status==='running'&&S.T>=sv.arriveAbs)arrive(sv);
 });
}
function tryDepartLegacy(sv){
 const line=lineOf(sv.lineId),train=trainOf(sv.trainUid);
 if(!train||train.freeAt>S.T)return; // 车辆未回库，继续等待
 const m=modelOf(train.modelId);
 const need=runningNeed();
 const driverRole=m.speed>=200?'hdriver':'kdriver';
 need[driverRole]++;need.crew+=Math.ceil(m.seats/300);
 if(staffCount(driverRole)<need[driverRole]||staffCount('crew')<need.crew){
  sv.late=true;return; // 等待人员
 }
 sv.depDay=S.day;sv.status='running';sv.delay=Math.max(0,todMinutes()-sv.depMin);
 sv.depAbs=S.T;sv.arriveAbs=S.T+durMin(line,m);
 const risk=breakdownRisk();
 const departureDelay=sv.delay;
 if(Math.random()<risk){
  sv.delay+=20+Math.floor(Math.random()*50);
  sv.arriveAbs+=sv.delay-departureDelay;
  toast('🔧 '+sv.code+' 列车设备故障，预计晚点 '+sv.delay+' 分钟','bad');
 }
 train.freeAt=Math.max(train.freeAt,sv.arriveAbs+(sv.turnMin??90));
 const energy=line.len*m.energy;
 S.cash-=energy;S.stats.cost+=energy;
}
function arrive(sv){
 sv.status='done';sv.doneDay=S.day;
 const line=lineOf(sv.lineId),train=trainOf(sv.trainUid),m=modelOf(train.modelId);
 let lf=lfBase()+0.02*COMMS.reduce((s,c)=>s+(S.comm[c.id]||0),0)+(S.holiday?0.15:0);
 if(sv.late)lf-=0.08;
 lf=Math.max(0.30,Math.min(0.98,lf));
 const pax=Math.floor(m.seats*lf);initOps();S.ops.totalPax+=pax;
 const rev=line.len*m.rate*pax+commBonusPerPax()*pax;
 let comp=0;
 if(sv.delay>15){comp=Math.round(rev*0.1);S.cash-=comp;S.stats.cost+=comp;}
 S.cash+=rev;S.stats.income+=rev;S.stats.trips++;
 S.stats.arrived++;if(sv.delay<=10)S.stats.onTime++;
 train.freeAt=Math.max(train.freeAt,sv.arriveAbs+(sv.turnMin??90));
 const onTime=sv.delay<=10;
 toast('🚄 '+sv.code+' '+svcEndpoints(sv)[0]+' → '+svcEndpoints(sv)[1]+
  ' 到达，载客 '+pax+' 人，票务+商业收益 <b>'+fmtY(rev)+'</b>'+(comp?('（晚点赔付 -'+fmt(comp)+'）'):''),
  onTime?'ok':'');
 save();
}
function newDay(){
 S.services.forEach(sv=>{if(sv.status==='done'){sv.status='wait';sv.late=false;sv.delay=0;}});
 // 每日固定成本
 let cost=0;
 S.staff.forEach(s=>{const r=ROLES.find(r=>r.id===s.role);cost+=r.salary/30;});
 LINES.forEach(l=>{if(S.lines[l.id])cost+=l.len*120;}); // 线路维护
 S.trains.forEach(t=>{cost+=modelOf(t.modelId).maint;});
 if(S.loans>0){const it=S.loans*0.0004;cost+=it;}
 S.yesterday={...S.stats};S.stats={income:0,cost:0,trips:0,onTime:S.stats.onTime,arrived:S.stats.arrived};
 S.cash-=cost;S.stats.cost+=cost;
 S.holiday=Math.random()<0.18;
 toast('📅 第 '+S.day+' 天开始：昨日收入 <b>'+fmtY(S.yesterday.income)+'</b>，成本 '+fmtY(S.yesterday.cost)+
  (S.holiday?' ｜ <b>节假日客流高峰！上座率提升</b>':''));
 if(Math.random()<0.12&&S.trains.length>0){
  const t=S.trains[Math.floor(Math.random()*S.trains.length)];
  t.freeAt=Math.max(t.freeAt,S.T+180);
  toast('🔧 '+modelOf(t.modelId).name+' 进入临检，停运 3 小时','bad');
 }
 save();
}

function doBuy(id){
 const m=modelOf(id);
 if(S.cash<m.price){toast('❌ 资金不足，可先申请银行贷款','bad');return;}
 S.cash-=m.price;
 S.ids.train++;
 S.trains.push({uid:S.ids.train,modelId:id,freeAt:0});
 toast('🎉 '+m.name+' 交付入库！','ok');
 closeModal();save();renderView();
}
function sellTrain(uid){
 const t=trainOf(uid);if(!t)return;
 if(t.freeAt>S.T){toast('❌ 该车正担当班次运行中，无法退役','bad');return;}
 if(S.services.some(s=>s.trainUid===uid&&s.status!=='done')){toast('❌ 该车尚有担当班次，请先删除相关班次','bad');return;}
 const m=modelOf(t.modelId);
 if(!confirm('确认将 '+m.name+' 退役出售？回收 '+fmtY(m.price*0.6)))return;
 S.cash+=m.price*0.6;
 S.trains=S.trains.filter(x=>x.uid!==uid);
 S.services=S.services.filter(s=>s.trainUid!==uid);
 toast('已退役出售，回收 '+fmtY(m.price*0.6));save();renderView();
}

function renderSVLegacy(){
 const order={running:0,wait:1,done:2};
 const list=[...S.services].sort((a,b)=>order[a.status]-order[b.status]||a.depMin-b.depMin);
 const rows=list.map(sv=>{
  const line=lineOf(sv.lineId),train=trainOf(sv.trainUid),m=train?modelOf(train.modelId):null;
  let chip='',body='';
  if(sv.status==='running'){
   const pct=Math.min(100,Math.max(0,(S.T-sv.depAbs)/(sv.arriveAbs-sv.depAbs)*100));
   chip='<span class="tag g">运行中</span>';
   body='<div class="prog"><i style="width:'+pct+'%"></i></div>'+
    '<div class="small">'+svcEndpoints(sv)[0]+' ⟶ '+svcEndpoints(sv)[1]+
    (sv.delay>0?' · <span class="r1">晚点 '+sv.delay+' 分</span>':' · 正点')+'</div>';
  }else if(sv.status==='wait'){
   chip='<span class="tag a">候车</span>'+(sv.late?'<span class="tag r">待人员/车辆</span>':'');
   body='<div class="small">每日 '+String(Math.floor(sv.depMin/60)).padStart(2,'0')+':'+String(sv.depMin%60).padStart(2,'0')+' 自 '+line.stations[0]+' 发车 · 单程约 '+(train?Math.round(durMin(line,m)/60*10)/10:'-')+' 小时</div>';
  }else{
   chip='<span class="tag gr">今日已到达</span>';
   body='<div class="small">明日 '+String(Math.floor(sv.depMin/60)).padStart(2,'0')+':'+String(sv.depMin%60).padStart(2,'0')+' 再始发</div>';
  }
  return `<div class="row"><div class="top"><b>${sv.code}</b><span class="tag b">直达</span><span class="tag gr">每日</span>
   ${chip}<div style="margin-left:auto" class="flex">
   <button class="btn red sm" onclick="delSvc('${sv.id}')">删除</button></div></div>
   <div class="meta">${line.name} ｜ 担当：${m?m.name:'?'}</div>${body}</div>`;
 }).join('');
 return `<div class="flex" style="margin-bottom:12px">
  <button class="btn" onclick="openSvc()">＋ 新增班次</button>
  <span class="small">共 ${S.services.length} 个日常班次 · 准点率受地勤与检修力量影响</span></div>
  <div class="list">${rows||'<div class="empty">还没有开行班次，点击上方按钮创建 🚄</div>'}</div>`;
}
function openSvcLegacy(){
 modalOpen=true;
 const lines=LINES.filter(l=>S.lines[l.id]);
 if(!lines.length){toast('❌ 请先建设一条线路','bad');modalOpen=false;return;}
 $('modalRoot').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">
  <h3>🕐 新增日常班次 <button class="x" onclick="closeModal()">✕</button></h3>
  <label class="lb">选择线路（已通车）</label>
  <select id="svcLine">${lines.map(l=>`<option value="${l.id}">${l.name}（${l.len} km / ${l.speed}km/h）</option>`).join('')}</select>
  <label class="lb">担当车组（须空闲且无时间冲突）</label>
  <select id="svcTrain">${S.trains.map(t=>`<option value="${t.uid}">${modelOf(t.modelId).name} · ${t.uid<10?'UT-0':'UT-'+t.uid}</option>`).join('')}</select>
  <label class="lb">发车时刻（24小时制）</label>
  <input id="svcTime" type="time" value="09:00">
  <div class="small" style="margin-top:10px;line-height:1.7">提示：同一车组可在不同时段担当多个班次，发车时会自动检查车辆回库时间与司机/乘务配备；高铁班次需<b>高速动车司机</b>，普速需<b>普速火车司机</b>，乘务员按定员/300 配备。</div>
  <div style="margin-top:16px"><button class="btn" style="width:100%" onclick="doSvc()">确认开行</button></div>
 </div></div>`;
 window.doSvc=function(){
  const lineId=$('svcLine').value,uid=parseInt($('svcTrain').value);
  const tv=$('svcTime').value.split(':');
  const depMin=parseInt(tv[0])*60+parseInt(tv[1]);
  const line=lineOf(lineId),train=trainOf(uid);if(!train){toast('请先购置车组','bad');return;}const m=modelOf(train.modelId);
  if(!train||!Number.isFinite(depMin)){toast('请选择车组和有效时刻','bad');return;}
  const d=durMin(line,m);
  // 冲突检查：同一车组在其他班次的 [dep, dep+dur+60] 区间
  for(const sv of S.services){
   if(sv.trainUid!==uid)continue;
   const ol=lineOf(sv.lineId),om=modelOf(trainOf(sv.trainUid).modelId);
   const a1=sv.depMin,a2=sv.depMin+durMin(ol,om)+90,b1=depMin,b2=depMin+d+90;
   if([-1440,0,1440].some(offset=>b1<a2+offset&&a1+offset<b2)){toast('❌ 该车组时刻冲突，请更换车组或调整时刻','bad');return;}
  }
  S.ids.svc++;
  const code=(m.speed>=300?'G':m.speed>=200?'D':'K')+S.ids.svc;
  S.services.push({id:'sv'+S.ids.svc,code,lineId,trainUid:uid,depMin,depDay:-1,status:'wait',late:false,delay:0});
  toast('✅ '+code+' 次列车已加入运行图（'+line.name+'）','ok');
  closeModal();save();renderView();
 };
}
function delSvcLegacy(id){
 if(S.services.some(x=>x.id===id&&x.status==='running')){toast('运行中的列车须到达后再移除','bad');return;}
 S.services=S.services.filter(s=>s.id!==id);
 toast('班次已从运行图移除');save();renderView();
}

function openFinance(){
 modalOpen=true;
 window.doLoan=function(amt){
  const cap=Math.max(5e8,netAssets()*2);
  if(S.loans+amt>cap){toast('❌ 超出授信额度（授信 '+fmtY(cap)+'）','bad');return;}
  S.loans+=amt;S.cash+=amt;
  toast('🏦 贷款 '+fmtY(amt)+' 到账，日利率 0.04%','ok');
  save();openFinance();renderClock();

  amt=Math.min(amt,S.loans,S.cash);

  S.loans-=amt;S.cash-=amt;

 };

function openGoals(){initOps();showModal('经营里程碑',GOALS.map((g,i)=>`<div class="goal"><b>${i+1}. ${g[0]} ${S.ops.claimed.includes(i)?'✓':''}</b><p>${g[1]} · 奖励 ${fmtY(g[3])}</p><button class="btn sm" ${S.ops.claimed.includes(i)||!g[2]()?'disabled':''} onclick="claimGoal(${i})">${S.ops.claimed.includes(i)?'已领取':g[2]()?'领取奖励':'继续经营'}</button></div>`).join('')+'<button class="btn sec" style="margin-top:14px" onclick="openEnding()">查看经营结局</button>');}

function openCase(){initOps();if(S.ops.case>=24){showModal('经营委员会', '<p class="small">24项议题已经完成，经营选择记入日志。继续扩张路网或查看经营结局。</p><button class="btn" onclick="openEnding()">经营结局</button>');return;}if(S.ops.caseDay>S.day){showModal('等待下一次经营会议','<p class="small">本日议题已完成。可以安排班次、改善配套、调整票价；下一个运营日将收到新议题。推进时间不计入有效新增游玩时长。</p>');return;}const c=CASES[S.ops.case];showModal('经营议题 '+(S.ops.case+1)+' / 24',`<span class="tag b">${c[0]}</span><p style="line-height:1.9;margin:15px 0">${c[1]}</p><div class="policy-grid"><button class="btn sec" onclick="decideCase(0)">${c[2]}</button><button class="btn sec" onclick="decideCase(1)">${c[5]}</button></div><p class="small" style="margin-top:14px">两项方案均可推进，资金不足可返回经营后再处理。每个运营日处理一个议题。</p>`);}
function decideCase(choice){if(S.ops.case>=24||S.ops.caseDay>S.day)return;const c=CASES[S.ops.case],cost=c[choice?6:3],rep=c[choice?7:4];if(S.cash<cost){toast('资金不足，先调整财务或选择另一方案','bad');return;}S.cash-=cost;S.ops.rep=Math.min(100,Math.max(0,S.ops.rep+rep));safeLog('第'+S.day+'天 '+c[0]+'：'+c[choice?5:2]);S.ops.case++;S.ops.caseDay=S.day+1;save();closeModal();renderClock();renderView();toast('决议已执行，现金与声誉已更新','ok');}
function openEnding(){initOps();const won=S.ops.claimed.length===12;let title=won?(S.ops.rep>=85?'万里通途':'稳健运营'):S.cash< -5e7?'债务重整':'路网仍在生长';showModal(title,`<img class="scene-small" src="assets/${won?'mountain':'terminal'}.webp" alt="铁路旅程"><p style="line-height:1.9">${won?'你已完成所有经营目标。列车把城市连在一起，也把每一次选择留在路网上。':S.cash< -5e7?'现金已低于负五千万。你可以申请贷款、出售闲置车组继续经营，或导出存档后重新开始。':'完成12个经营里程碑后将评定最终经营结局。可以继续经营，也可以保留本次进度。'}</p><p class="small">目标 ${S.ops.claimed.length}/12 · 议题 ${S.ops.case}/24 · 声誉 ${S.ops.rep}</p><button class="btn" onclick="closeModal()">继续经营</button>`);}

 if(f.mode==='round')legs.push(resetLeg12({...oldRet,...common,id:retId,code:f.returnCode,direction:-f.direction,depMin:f.returnMin,startAbs:returnStart,nextDepAbs:returnStart,leg:'return'}));
 S.services=S.services.filter(x=>!edit.ids.includes(x.id));S.services.push(...legs);S.scheduleSchema=2;
 save();closeModal();renderView();toast((oldOut?'运行图已调整':'已安排')+'：'+legs.map(x=>x.code).join(' / ')+'，保留现有经营进度','ok');
}
function showSvcError12(message){$('svcError12').textContent=message;$('svcError12').style.display='block';$('svcError12').scrollIntoView({block:'nearest'});}
function delSvc(id){
 const sv=S.services.find(x=>x.id===id);if(!sv)return;const legs=group12(sv);
 if(legs.some(x=>x.status==='running')){toast('请等本组列车到达后再删除','bad');return;}
 if(!confirm(legs.length===2?'确认删除 '+legs.map(x=>x.code).join(' / ')+' 这对往返？将同时删除去返两趟。':'确认删除 '+sv.code+'？'))return;
 const ids=new Set(legs.map(x=>x.id));S.services=S.services.filter(x=>!ids.has(x.id));save();renderView();toast('已从运行图删除');
}
function quickDispatch(){switchTab('sv');openSvc();}
const originalDur12=durMin;durMin=function(line,model){return Math.round(line.len/Math.min(line.speed,model.speed)*60+line.stations.length*4);};
const newStateBefore12=newState;newState=function(){const d=newStateBefore12();migrateSchedule12(d);return d;};

migrateSchedule12(S);renderTabs();renderClock();renderView();
