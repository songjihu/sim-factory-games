<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>开个面馆 · 山城清晨</title>
<meta name="theme-color" content="#f6f1e6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="开个面馆">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script id="nozoom">
/* 拦掉 iOS 双指缩放与双击放大 */
(function(){
  var stop=function(e){e.preventDefault();};
  document.addEventListener("gesturestart",stop,{passive:false});
  document.addEventListener("gesturechange",stop,{passive:false});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
})();
</script>
<style>
:root{
  --paper:#f6f1e6; --paper2:#ede5d2; --card:#fffdf6;
  --ink:#2b2320; --ink2:#57493f; --muted:#8a7c6e; --line:#ddd2bc;
  --chili:#b8402e; --chili2:#d4553f; --gold:#a8843c; --goldt:#6e5522;
  --good:#2f6b4f; --bad:#a03428; --warn:#9a6a1f;
  --shadow:0 1px 2px rgba(43,35,32,.08),0 4px 14px rgba(43,35,32,.06);
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --apph:100dvh;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--paper2);color:var(--ink);touch-action:manipulation;}
#app{position:relative;margin:0 auto;height:var(--apph);max-width:520px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12);}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.hidden{display:none!important;}
button{font-family:var(--font);border:none;cursor:pointer;background:none;color:inherit;}
/* ---------- 标题页 ---------- */
#scr-title{align-items:center;justify-content:flex-start;}
#title-art{width:100%;flex:0 0 auto;}
.title-pad{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 20px 28px;width:100%;}
.game-title{font-size:34px;letter-spacing:6px;font-weight:800;color:var(--ink);}
.game-sub{margin-top:4px;color:var(--chili);font-size:13px;letter-spacing:3px;}
.title-btns{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;}
.btn{display:block;width:100%;padding:13px 16px;border-radius:var(--r);font-size:16px;font-weight:700;text-align:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
.btn.primary{background:var(--chili);border-color:var(--chili);color:#fff;}
.btn:disabled{opacity:.45;}
.tips{margin-top:12px;color:var(--muted);font-size:11px;text-align:center;line-height:1.7;}
/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-bottom:1.5px solid var(--line);}
.hud-item{display:flex;flex-direction:column;min-width:0;}
.hud-k{font-size:10px;color:var(--muted);}
.hud-v{font-size:14px;font-weight:800;white-space:nowrap;}
.hud-v.warn{color:var(--bad);}
#hud-spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.icon-btn svg{width:20px;height:20px;}
/* ---------- 客座 ---------- */
#seats{flex:1 1 30%;min-height:118px;display:flex;gap:6px;padding:8px 8px 4px;}
.seat{flex:1;background:var(--paper2);border:1.5px dashed var(--line);border-radius:var(--r);position:relative;padding:6px 4px;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:background .2s,border-color .2s;}
.seat.occupied{border-style:solid;background:var(--card);box-shadow:var(--shadow);border-color:var(--line);}
.seat.clickable{cursor:pointer;}
.seat.occupied.clickable:active{background:#fdf6e8;}
.seat.leaving{opacity:.4;}
.seat .ava{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--paper2);}
.seat .ava svg{width:100%;height:100%;display:block;}
.seat .cname{font-size:10px;color:var(--ink2);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.order-bubble{margin-top:3px;background:var(--ink);color:#fdf6e8;font-size:11px;font-weight:700;border-radius:9px;padding:4px 6px;text-align:center;line-height:1.45;max-width:100%;}
.order-bubble .spice{color:#ffb37f;}
.order-bubble .extra{color:#ffe3a3;font-weight:500;font-size:10px;}
.patience-wrap{margin-top:auto;width:100%;height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;}
.patience-bar{height:100%;background:var(--good);border-radius:3px;transition:width .2s linear;}
.patience-bar.mid{background:var(--warn);}
.patience-bar.low{background:var(--bad);}
.seat-state{font-size:9px;color:var(--muted);margin-top:2px;height:12px;}
/* ---------- 灶台 / 调味台 ---------- */
#mid{flex:0 0 auto;padding:2px 8px;display:flex;flex-direction:column;gap:6px;}
.row-label{font-size:10px;color:var(--muted);letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.row-label:before,.row-label:after{content:"";flex:1;height:1px;background:var(--line);}
#burners{display:flex;gap:6px;}
.burner{flex:1;height:64px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);}
.burner.idle{background:var(--paper2);border-style:dashed;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-size:11px;}
.burner.idle .bname,.burner.idle .bhint,.burner.idle .cook-track{display:none;}
.burner:not(.idle) .blabel{display:none;}
.burner .blabel{pointer-events:none;}
.burner.cooking{cursor:pointer;}
.burner .bname{position:absolute;top:4px;left:7px;font-size:10px;color:var(--ink2);font-weight:700;z-index:2;}
.burner .bhint{position:absolute;top:4px;right:7px;font-size:9px;color:var(--muted);z-index:2;}
.cook-track{height:14px;margin:0 6px 8px;background:var(--paper2);border-radius:7px;position:relative;overflow:hidden;}
.cook-fill{height:100%;width:0;background:linear-gradient(90deg,#d4553f,#b8402e);border-radius:7px;}
.cook-zone{position:absolute;top:0;height:100%;background:rgba(47,107,79,.28);border-left:1.5px solid var(--good);border-right:1.5px solid var(--good);}
.burner.done{border-color:var(--gold);background:#fbf3dd;}
.burner.done .bhint{color:var(--goldt);font-weight:700;}
.burner.trashed{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#prep{min-height:86px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 8px;box-shadow:var(--shadow);}
#prep.empty{background:var(--paper2);border-style:dashed;box-shadow:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;}
#prep .prep-head{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink2);}
#prep .prep-head .tag{font-size:9px;font-weight:500;color:var(--muted);}
.recipe-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.chip{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--paper2);color:var(--ink2);border:1.5px solid transparent;}
.chip.done{background:var(--good);color:#fff;}
.chip.next{border-color:var(--chili);color:var(--chili);font-weight:800;}
.chip.result{margin-left:auto;background:var(--paper2);color:var(--ink2);}
/* ---------- 佐料台 ---------- */
#palette{flex:0 0 auto;padding:6px 8px 4px;}
#palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.ing{padding:9px 2px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink);text-align:center;box-shadow:var(--shadow);}
.ing:active{transform:scale(.96);}
.ing.hint{border-color:var(--chili);color:var(--chili);animation:pulse 1s infinite;}
.ing.err{background:var(--bad);color:#fff;border-color:var(--bad);}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px rgba(184,64,46,.18)}}
.ing:disabled{opacity:.5;}
/* ---------- 底栏 ---------- */
#foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));}
#combo-tag{font-size:12px;font-weight:800;color:var(--chili);min-width:64px;}
#day-progress{flex:1;height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;}
#day-progress .fill{height:100%;background:var(--gold);width:0;}
#served-tag{font-size:11px;color:var(--muted);white-space:nowrap;}
/* ---------- 弹窗 ---------- */
#modal{position:absolute;inset:0;background:rgba(43,35,32,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
#modal .box{background:var(--paper);border-radius:16px;max-width:420px;width:100%;max-height:82%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;}
.modal-head{padding:14px 16px 0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;}
.modal-head .stamp{font-size:10px;color:#fff;background:var(--chili);border-radius:4px;padding:2px 6px;letter-spacing:1px;}
.modal-body{padding:10px 16px;font-size:13.5px;line-height:1.8;color:var(--ink2);overflow-y:auto;}
.modal-body b{color:var(--ink);}
.modal-body .figure{display:flex;justify-content:center;margin:6px 0;}
.modal-body .figure svg{width:84px;height:84px;}
.modal-btns{padding:6px 16px 16px;display:flex;flex-direction:column;gap:8px;}
.settle-table{width:100%;border-collapse:collapse;margin:4px 0;}
.settle-table td{padding:5px 2px;font-size:13px;border-bottom:1px dashed var(--line);}
.settle-table td:last-child{text-align:right;font-weight:800;color:var(--ink);}
.settle-table tr.total td{border-bottom:none;font-size:15px;color:var(--chili);}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);}
.shop-item .si-info{flex:1;min-width:0;}
.shop-item .si-name{font-size:14px;font-weight:800;}
.shop-item .si-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
.shop-item .si-buy{flex:0 0 auto;padding:8px 12px;border-radius:9px;background:var(--chili);color:#fff;font-size:12px;font-weight:800;}
.shop-item .si-buy:disabled{background:var(--line);color:var(--muted);}
.shop-item.owned .si-name{color:var(--good);}
/* ---------- toast ---------- */
#toast-wrap{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:80;pointer-events:none;}
.toast{background:rgba(43,35,32,.92);color:#fdf6e8;font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;animation:toastin .18s ease-out;}
.toast.bad{background:rgba(160,52,40,.95);}
.toast.good{background:rgba(47,107,79,.95);}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ---------- 结局 ---------- */
#scr-ending{padding:20px 18px;overflow-y:auto;}
.ending-title{font-size:26px;font-weight:800;color:var(--chili);letter-spacing:2px;}
.ending-grade{font-size:12px;color:var(--goldt);letter-spacing:2px;margin-top:2px;}
.ending-body{margin-top:12px;font-size:14px;line-height:1.9;color:var(--ink2);}
.ending-stats{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px;}
.ending-stats div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);}
.ending-stats div:last-child{border-bottom:none;}
#poster-canvas{width:100%;border-radius:var(--r);border:1.5px solid var(--line);margin-top:14px;}
.float-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,35,32,.55);color:#fdf6e8;font-size:15px;font-weight:800;letter-spacing:2px;z-index:60;flex-direction:column;gap:8px;}
.float-note small{font-size:11px;font-weight:400;color:#d8cfc2;}
.phone-order{display:flex;align-items:center;gap:8px;margin:4px 8px;padding:7px 10px;background:#fbf3dd;border:1.5px solid var(--gold);border-radius:10px;font-size:12px;font-weight:700;color:var(--goldt);}
.ing{display:flex;align-items:center;justify-content:center;gap:3px;min-height:42px;padding:4px 2px!important}.ing svg{width:25px;height:25px;flex-shrink:0}.ing span{font-size:12px}@media(max-width:360px){.ing{flex-direction:column;gap:0}.ing svg{width:22px;height:22px}}
</style>
</head>
<body>
<div id="app">
  <!-- 标题 -->
  <div id="scr-title" class="screen">
    <svg id="title-art" viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg">
      <rect width="520" height="300" fill="#f6f1e6"/>
      <rect x="0" y="250" width="520" height="50" fill="#e7dcc4"/>
      <!-- 远山 -->
      <path d="M0,210 Q80,150 160,200 T330,190 T520,205 V250 H0 Z" fill="#ddd2bc" opacity=".7"/>
      <!-- 屋檐 -->
      <path d="M40,96 L260,66 L480,96 L480,110 L40,110 Z" fill="#8a3a2a"/>
      <path d="M28,110 L492,110 L492,118 L28,118 Z" fill="#6e2d20"/>
      <!-- 匾额 -->
      <rect x="188" y="122" width="144" height="40" rx="6" fill="#2b2320"/>
      <text x="260" y="149" font-size="22" fill="#e8b84b" text-anchor="middle" font-weight="bold" letter-spacing="4">陈记小面</text>
      <!-- 灯笼 -->
      <line x1="120" y1="118" x2="120" y2="132" stroke="#57493f" stroke-width="2"/>
      <ellipse cx="120" cy="148" rx="14" ry="17" fill="#c33a28"/>
      <ellipse cx="120" cy="148" rx="6" ry="17" fill="#a52e1e"/>
      <text x="120" y="153" font-size="11" fill="#f6d8a0" text-anchor="middle">面</text>
      <line x1="400" y1="118" x2="400" y2="132" stroke="#57493f" stroke-width="2"/>
      <ellipse cx="400" cy="148" rx="14" ry="17" fill="#c33a28"/>
      <ellipse cx="400" cy="148" rx="6" ry="17" fill="#a52e1e"/>
      <text x="400" y="153" font-size="11" fill="#f6d8a0" text-anchor="middle">面</text>
      <!-- 铺门 -->
      <rect x="60" y="180" width="400" height="70" rx="8" fill="#fffdf6" stroke="#ddd2bc" stroke-width="2"/>
      <rect x="76" y="196" width="90" height="54" rx="4" fill="#e9dfc8"/>
      <rect x="354" y="196" width="90" height="54" rx="4" fill="#e9dfc8"/>
      <!-- 一碗面 -->
      <g transform="translate(260,222)">
        <path d="M-34,0 A34,22 0 0 0 34,0 L30,10 A30,16 0 0 1 -30,10 Z" fill="#b8402e"/>
        <path d="M-30,-2 Q0,10 30,-2 L26,6 A26,12 0 0 1 -26,6 Z" fill="#8f3122"/>
        <path d="M-24,-4 Q0,4 24,-4 Q12,-14 0,-12 Q-14,-14 -24,-4 Z" fill="#f0d9a8"/>
        <path d="M-18,-7 Q0,-1 18,-7" stroke="#d4553f" stroke-width="3" fill="none"/>
        <circle cx="-8" cy="-9" r="3.5" fill="#7c5a2e"/>
        <circle cx="9" cy="-10" r="3" fill="#5e7a4a"/>
        <path d="M34,-6 L52,-26 M38,0 L60,-14" stroke="#8a5a34" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="260" y="278" font-size="12" fill="#8a7c6e" text-anchor="middle" letter-spacing="2">清晨五点半 · 竹器巷</text>
    </svg>
    <div class="title-pad">
      <div class="game-title">开个面馆</div>
      <div class="game-sub" data-version="1.0.2">山城清晨 · 三十天</div>
      <div class="title-btns">
        <button class="btn primary" id="btn-continue">继续经营</button>
        <button class="btn" id="btn-new">开张</button>
        <button class="btn" id="btn-help">怎么玩</button><button class="btn" id="btn-save-tools">存档管理</button>
      </div>
      <div class="tips" id="title-tips">外婆的面馆，三十天，一万五的债。<br>灶上的火不等人，手要快，心要稳。</div>
    </div>
  </div>
  <!-- 游戏 -->
  <div id="scr-game" class="screen hidden">
    <div id="hud">
      <div class="hud-item"><span class="hud-k" id="hud-day-k">第1天</span><span class="hud-v" id="hud-day">清晨</span></div>
      <div class="hud-item"><span class="hud-k">钱</span><span class="hud-v" id="hud-money">¥0</span></div>
      <div class="hud-item"><span class="hud-k">口碑</span><span class="hud-v" id="hud-rep">50</span></div>
      <div class="hud-item"><span class="hud-k">欠款</span><span class="hud-v warn" id="hud-debt">¥15000</span></div>
      <div id="hud-spacer"></div>
      <button class="icon-btn" id="btn-pause" aria-label="暂停"><svg viewBox="0 0 24 24" fill="none" stroke="#57493f" stroke-width="2.4"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
    </div>
    <div id="seats"></div>
    <div id="phone-slot"></div>
    <div id="mid">
      <div class="row-label">灶 台</div>
      <div id="burners"></div>
      <div id="prep" class="empty">调味台空着 —— 捞一碗面过来</div>
    </div>
    <div id="palette">
      <div id="palette-grid"></div>
    </div>
    <div id="foot">
      <span id="combo-tag"></span>
      <div id="day-progress"><div class="fill"></div></div>
      <span id="served-tag">0 碗</span>
    </div>
  </div>
  <!-- 结局 -->
  <div id="scr-ending" class="screen hidden"></div>
  <div id="modal" class="hidden"><div class="box" id="modal-box"></div></div>
  <div id="toast-wrap"></div>
</div>
<script>
/* =====================================================================
   开个面馆 · 山城清晨 —— 单文件实时经营动作游戏
   玩法：实时时间管理（接单-煮面-调味-出餐），回合外有日结/升级/事件。
   结构：BALANCE(全部数值) -> DATA(菜/佐料/升级/事件/常客) -> RNG -> ENGINE(纯逻辑)
         -> SAVE -> AUDIO -> UI -> SERVICE(实时循环) -> BOOT
   ===================================================================== */

/* =====================================================================
   BALANCE —— 所有数值都在这里。逻辑里不许出现魔数。
   货币单位:元。
   ===================================================================== */
const BALANCE = {
  ver: 1,
  saveKey: "kmg_g201_save",
  metaKey: "kmg_g201_meta",
  days: 30,
  debt: 6000,                        // 外婆的债（终局判定用）
  payFloor: 300,                     // 还款后至少留的生活费
  milestones: { 10: 1500, 20: 3500, 30: 6000 },  // 分段还款目标(累计已还)
  milestoneDays: [10, 20, 30],
  interestMiss: 600,                 // 错过里程碑,利息加到下一档
  repStart: 50,
  seats: 4,
  noodleTime: 3.5,                   // 煮面秒数
  noodleFast: 2.9,                   // 深锅升级后
  perfect: 0.35,                     // 完美窗口 ±s
  good: 0.8,                         // 合格窗口 ±s
  soggy: 0.9,                        // 超时这么久,面坨了(自动砸)
  quality: { perfect: 1.35, ok: 1.0, meh: 0.7, ruined: 0 },
  tierLine: { perfect: 95, ok: 70, meh: 40 },
  noodleBase: { perfect: 100, ok: 78, raw: 45 },
  wrongPenalty: 18,                  // 佐料点错一次扣的品质
  comboStep: 0.05, comboMax: 0.5,
  rep: { perfect: 0.9, ok: 0.2, meh: 0, ruined: -2.5, timeout: -3 },
  sodaChance: 0.22, sodaPrice: 3, sodaPriceHot: 5,
  dailyCost: { rent: 50, util: 18, spicePerBowl: 1.5 },
  customersBase: 12, customersGrowth: 0.95,
  spawnGap: { start: 6.5, end: 3.0 },
  doubleSpawnP: 0.28,
  patience: 26, patienceUpgraded: 31,
  phoneTime: 24, phoneRingTime: 5, phoneP: 0.16,
  price: { su: 10, jz: 14, nr: 19, fc: 19, wz: 22 },
  unlock: { jz: 150, nr: 500, fc: 800, wz: 1000 },
  spiceCost: { 0: 0.4, 1: 1.5, 2: 2.2 },  // 微辣/中辣/特辣 每碗佐料成本
  endingLine: { second: 5000, community: 1200, fiftyRep: 85, grandmaRep: 90 },
};

/* =====================================================================
   DATA —— 菜 / 佐料 / 升级 / 事件 / 常客

/* =====================================================================
   RNG —— 种子化 LCG，可复现
   ===================================================================== */
function makeRng(seed){
  let s = seed >>> 0;
  const f = function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  f.seed = function(){ return seed; };
  return f;
}

/* =====================================================================
   ENGINE —— 纯逻辑，可无头测试
   ===================================================================== */
function unlockedMenu(G){
  const arr = ["su"];
  MENU_ORDER.forEach(id=>{ if(id!=="su" && G.upgrades["menu_"+id]) arr.push(id); });
  return arr;
}

/* 生成一个订单。force: {dishId, spice} 用于常客点单（不受菜单解锁限制） */
function makeOrder(G, rng, dayParams, force){
  const menu = unlockedMenu(G);
  let dishId;
  if(force && DISHES[force.dishId]){ dishId = force.dishId; }
  else {
    /* 越贵的面越靠后才可能被点，前期以素小面为主 */
    const weights = menu.map((id,i)=> 10 - i*1.6 + (dayParams.dayNum*0.12));
    let total = weights.reduce((a,b)=>a+b,0), roll = rng()*total;
    dishId = menu[0];
    for(let i=0;i<menu.length;i++){ roll -= weights[i]; if(roll<=0){ dishId = menu[i]; break; } }
  }
  const dish = DISHES[dishId];
  /* 辣度：随天数与口碑，特辣概率上升 */
  let spice = 1;
  if(force && force.spice){ spice = force.spice; }
  else if(dayParams.forceSpice){ spice = 1; }
  else {
    const r = rng();
    const hotP = Math.min(0.5, 0.12 + dayParams.dayNum*0.012 + Math.max(0,(G.rep-50))*0.004);
    if(r < hotP*0.4) spice = 3; else if(r < hotP) spice = 2;
  }
  const egg = force ? false : rng() < Math.min(0.3, 0.06 + dayParams.dayNum*0.007);
  const green = force ? false : rng() < Math.min(0.35, 0.08 + dayParams.dayNum*0.008);
  /* 配方 */
  const recipe = dish.base.slice();
  for(let i=0;i<EXTRA_TAPS[spice];i++){
    const at = recipe.indexOf("yl");
    recipe.splice(at+1, 0, "yl");
  }
  if(egg) recipe.push("dan");
  if(green) recipe.push("qing");
  const price = BALANCE.price[dishId] - (dayParams.priceCut||0);
  return {
    dishId, dishName: dish.name, spice, egg, green, price: Math.max(5,price),
    recipe,
    label: dish.name + (spice!==1 ? "·"+SPICE_NAMES[spice] : "") + (egg?"·加蛋":"") + (green?"·加青":""),
    custName: force && force.name ? force.name : SURNAMES[Math.floor(rng()*SURNAMES.length)] + GIVEN[Math.floor(rng()*GIVEN.length)],
  };
}

/* 当日客流参数 */
function dayParams(G, dayNum, weather, eventApplies){
  const d = {
    dayNum, spawnMul:1, patienceMul:1, spiceMul:1, spawnAdd:0,
    priceCut:0, forceSpice:0, rushFront:false, blackout:false, hot:false, sick:false,
  };
  (eventApplies||[]).forEach(fn=>fn(d));
  if(weather==="rain") d.spawnMul*=0.62;
  if(G.upgrades.sign) d.spawnMul*=1.12;
  if(G.pressBoost) d.spawnMul*=1.08;
  if(G.upgrades.phone && G.leiBoost) d.phoneMul = 1.6; else d.phoneMul = 1;
  return d;
}

function customersOfDays(G, dayNum, spawnMul, spawnAdd){
  const n = BALANCE.customersBase + (dayNum-1)*BALANCE.customersGrowth;
  return Math.max(4, Math.round(n*spawnMul) + (spawnAdd||0));
}

/* 品质结算：纯函数 */
function computeQuality(noodleResult, wrongTaps){
  const base = BALANCE.noodleBase[noodleResult];
  return Math.max(0, base - wrongTaps*BALANCE.wrongPenalty);
}
function qualityTier(q){
  if(q >= BALANCE.tierLine.perfect) return "perfect";
  if(q >= BALANCE.tierLine.ok) return "ok";
  if(q >= BALANCE.tierLine.meh) return "meh";
  return "ruined";
}
function payOf(order, tier, comboCount){
  if(tier==="ruined") return 0;
  let mult = BALANCE.quality[tier];
  const comboBonus = Math.min(BALANCE.comboMax, Math.max(0,comboCount-1)*BALANCE.comboStep);
  return Math.round(order.price * mult * (1+comboBonus));
}
function repDelta(tier){ return BALANCE.rep[tier]; }

/* 日成本 */
function dayCost(bowls, spiceMul, G){
  return BALANCE.dailyCost.rent + BALANCE.dailyCost.util + Math.round(bowls*BALANCE.dailyCost.spicePerBowl*spiceMul);
}

/* 结局判定：纯函数 */
function endingCalc(G){
  const debtPaid = G.debtPaid >= BALANCE.debt;
  const M = G.regulars;
  const allLines = M.zhou>=3 && M.chen>=3 && M.lei>=3 && M.niang>=3;
  const L = BALANCE.endingLine;
  if(!debtPaid) return { id:"transfer", grade:"乙下", title:"转让离场" };
  if(G.missedMilestones===0 && allLines && G.rep >= L.grandmaRep) return { id:"grandma", grade:"甲上", title:"外婆的味道" };
  if(G.money >= L.second) return { id:"second", grade:"甲上", title:"二店开张" };
  if(G.fiftyNominated && G.rep >= L.fiftyRep) return { id:"fifty", grade:"甲", title:"小面五十强" };
  if(G.money >= L.community || G.rep >= 72) return { id:"community", grade:"乙上", title:"社区味道" };
  return { id:"struggle", grade:"乙", title:"巷子深处" };
}

/* =====================================================================
   AUDIO —— Web Audio 合成，无音频文件
   ===================================================================== */
const AUDIO = (()=>{
  let ctx = null;
  function ac(){
    if(HEADLESS) return null;
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when, slide){
    const c = ac(); if(!c) return;
    const t = c.currentTime + (when||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur, vol){
    const c = ac(); if(!c) return;
    const len = c.sampleRate*dur, buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1)*(1-i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol||0.08;
    src.connect(g); g.connect(c.destination); src.start();
  }
  return {
    tap(){ tone(520, 0.06, "square", 0.06); },
    pour(){ noise(0.4, 0.1); },
    perfect(){ tone(660,0.1,"sine",0.12); tone(880,0.14,"sine",0.12,0.09); },
    good(){ tone(520,0.12,"sine",0.1); },
    meh(){ tone(330,0.14,"sine",0.1); },
    fail(){ tone(220,0.35,"sawtooth",0.12,0,90); noise(0.25,0.1); },
    serve(){ tone(880,0.09,"triangle",0.14); tone(1174,0.12,"triangle",0.1,0.07); },
    coin(){ tone(988,0.07,"square",0.07); tone(1319,0.1,"square",0.07,0.06); },
    event(){ tone(494,0.2,"triangle",0.1); tone(494,0.2,"triangle",0.08,0.22); },
    ring(){ for(let i=0;i<3;i++){ tone(1046,0.09,"square",0.08,i*0.12); tone(784,0.09,"square",0.08,i*0.12+0.06);} },
    leave(){ tone(300,0.2,"sine",0.08,0,180); },
  };
})();

function newDayRuntime(dayNum, params){
  const rng = makeRng(G.seed + dayNum*7919);
  const cookTime = (G.upgrades.pot ? BALANCE.noodleFast : BALANCE.noodleTime) + (params.sick?0.4:0);
  const runtime = {
    dayNum, params, rng,
    t: 0, running: true, paused: false, over:false,
    toSpawn: customersOfDays(G, dayNum, params.spawnMul, params.spawnAdd),
    spawned: 0, spawnedTotal: 0,
    nextSpawn: 1.2,
    customers: [],           // {order,patience,patienceMax,seatIdx,state,isPhone,isRegular}
    burners: [],             // {state:'idle'|'cooking', t, order, customer, el}
    prepQueue: [],           // 完成煮面待调味
    prep: null,              // {order, step, wrong, noodleQ, custRef}
    phone: null,             // {order, state:'ringing'|'accepted', t}
    phoneCd: 8,
    served: 0, lost: 0, ruined: 0, revenue: 0, soda: 0,
    combo: 0, dayFlavor: null, sick: !!params.sick,
    noodleWindow: (G.niangSoup?0.45:BALANCE.perfect),
    goodWindow: (G.niangSoup?0.95:BALANCE.good),
    cookTime,
    blackoutT: 0, blackoutDone: false,
  };
  for(let i=0;i<burnerCount();i++) runtime.burners.push({state:"idle", t:0, order:null, customer:null, el:null});
  runtime.spawnedTotal = runtime.toSpawn;
  return runtime;
}

function burnerCount(){ return 1 + (G.upgrades.burner2?1:0) + (G.upgrades.burner3?1:0); }

function startDay(){
  const dayNum = G.day;
  const pd = PENDING_DAY || pickDayEvents();
  const weather = pd.weather;
  const applies = pd.list.filter(e=>e.event.apply).map(e=>e.event.apply);
  const params = dayParams(G, dayNum, weather, applies);
  if(DAYC.daySick){ params.sick = true; }
  R = newDayRuntime(dayNum, params);
  R.dueRegular = pd.regular || null;
  R.regularOk = false;
  renderSeats(); renderBurners(); renderPalette(); renderPrep(); renderHUD(); renderPhoneSlot();
  showScreen("game");
  const wtxt = weather==="rain" ? "今天有雨。" : (params.hot?"日头毒。":"天晴。");
  toast(`第 ${dayNum} 天开张 —— ${wtxt}`, "");
  AUDIO.pour();
}

function pickDayEvents(){
  const rng = makeRng(G.seed + G.day*104729);
  const list = [];
  let weather = null;
  if(rng()<0.22){ weather = "rain"; }
  EVENTS.forEach(ev=>{
    if(ev.day[0] > G.day || G.day > ev.day[1]) return;
    if(ev.once && G.flags["ev_"+ev.id]) return;
    if(ev.cond && !ev.cond({G, rng})) return;
    /* 进日简报（应用参数/出选择） */
    if(rng() < Math.min(0.9, ev.w/10)){
      list.push({event:ev});
      G.flags["ev_"+ev.id] = true;
      if(ev.id==="chain") G.chainHappened = true;
    }
  });
  return { weather, list };
}

      div.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#a8843c" stroke-width="2"><path d="M4 5c0 8 7 15 15 15l2-4-4-2-2 2c-3-1-6-4-7-7l2-2-2-4z"/></svg> 外卖单：${ph.order.label} <span style="color:var(--bad)">${left.toFixed(0)}s</span>`;
    }
    $("#phone-slot").appendChild(div);
  }
}

/* ---------- 交互 ---------- */
function onSeatClick(i){
  if(!R || !R.running || R.paused) return;
  const c = R.customers.find(x=>x.seatIdx===i && x.state==="waiting-cook");
  if(!c) return;
  const bi = R.burners.findIndex(b=>b.state==="idle");
  if(bi<0){ toast("灶眼满了，先捞一碗", "bad"); return; }
  if(R.blackoutT>0){ toast("没电，灶点不着", "bad"); return; }
  const b = R.burners[bi];
  b.state = "cooking"; b.t = 0; b.order = c.order; b.customer = c;
  c.state = "cooking";
  AUDIO.pour();
  updateSeat(c); updateBurner(bi);
}
function onBurnerClick(i){
  if(!R || !R.running || R.paused) return;
  const b = R.burners[i];
  if(!b || b.state!=="cooking") return;
  const diff = b.t - R.cookTime;
  let res;
  const pw = R.noodleWindow, gw = R.goodWindow;
  if(Math.abs(diff) <= pw) res = "perfect";
  else if(diff < 0 && Math.abs(diff) <= gw) res = "raw";
  else if(diff > 0 && diff <= gw) res = "ok";
  else if(diff < 0) res = "raw";
  else res = "ok";
  /* 收碗进调味队列（先取引用再清理灶眼） */
  const doneOrder = b.order, doneCust = b.customer;
  b.state = "idle"; b.order = null; b.customer = null;
  b.el.classList.remove("cooking","done","trashed");
  b.el.classList.add("idle"); b.el.querySelector(".bname").textContent="";
  b.el.querySelector(".bhint").textContent="";
  b.el.querySelector(".cook-fill").style.width="0";
  const zone = b.el.querySelector(".cook-zone"); if(zone) zone.remove();
  if(res==="raw"){
    /* 夹生：面废了，客人还在等 */
    R.ruined++; R.combo = 0;
    toast("夹生了！重新煮", "bad"); AUDIO.fail();
    doneCust.state = "waiting-cook";
    updateSeat(doneCust);
    return;
  }
  R.prepQueue.push({ order:doneOrder, noodleQ: res==="perfect" ? 100 : BALANCE.noodleBase.ok, custRef:doneCust });
  doneCust.state = "prep";
  AUDIO.tap();
  pumpPrep();
  renderPrep();
}
function onIngredient(id, btn){
  if(!R || !R.running || R.paused) return;
  if(!R.prep) { toast("调味台上没有面", ""); return; }
  const cur = R.prep;
  const need = cur.order.recipe[cur.step];
  if(id === need){
    cur.step++;
    AUDIO.tap();
    if(cur.step >= cur.order.recipe.length){ finishPrep(); return; }
    renderPrep();
    if(G.upgrades.memo) hintNext();
  } else {
    cur.wrong++;
    AUDIO.fail();
    if(btn){ btn.classList.add("err"); setTimeout(()=>btn.classList.remove("err"),220); }
    toast("放错了——"+TOPPINGS[need], "bad");
    renderPrep();
  }
}
function hintNext(){
  document.querySelectorAll(".ing").forEach(b=>b.classList.remove("hint"));
  if(R && R.prep){
    const need = R.prep.order.recipe[R.prep.step];
    document.querySelectorAll(".ing").forEach(b=>{
      if(b.textContent === TOPPINGS[need]) b.classList.add("hint");
    });
  }
}
function pumpPrep(){
  if(R.prep) return;
  const next = R.prepQueue.shift();
  if(!next) return;
  R.prep = { order:next.order, step:0, wrong:0, noodleQ:next.noodleQ, custRef:next.custRef };
  renderPrep();
  if(G.upgrades.memo) hintNext();
}
function finishPrep(){
  const cur = R.prep;
  R.prep = null;
  const q = computeQuality(cur.noodleQ >= 100 ? "perfect" : (cur.noodleQ>=78?"ok":"raw"), cur.wrong);
  const tier = qualityTier(q);
  serve(cur.custRef, cur.order, tier);
  pumpPrep();
  renderPrep();
}
function serve(cust, order, tier){
  cust.state = "served";
  AUDIO.serve();
  if(cust.isPhone && R.phone){ R.phone = null; renderPhoneSlot(); }
  if(tier==="ruined"){
    R.ruined++; R.combo = 0; G.totalRuined++;
    if(cust.isRegular) R.regularOk = false;
    G.rep = Math.max(0, G.rep + repDelta("ruined"));
    toast(`${order.custName}：这碗没法吃……`, "bad");
  } else {
    if(cust.isRegular && (tier==="perfect"||tier==="ok")) R.regularOk = true;
    const pay = payOf(order, tier, R.combo);
    R.combo++;
    R.comboBest = Math.max(R.comboBest||0, R.combo);
    G.bestCombo = Math.max(G.bestCombo||0, R.combo);
    let sodaP = BALANCE.sodaChance * (R.params.hot?2.2:1);
    let sodaPay = 0;
    if(G.upgrades.fridge && Math.random()<sodaP){ sodaPay = R.params.hot? BALANCE.sodaPriceHot : BALANCE.sodaPrice; R.soda++; }
    R.revenue += pay + sodaPay;
    R.served++; G.totalServed++;
    G.rep = Math.min(100, G.rep + repDelta(tier));
    const tags = { perfect:"完美！", ok:"不错", meh:"将就" };
    toast(`${order.custName} ${tags[tier]} +¥${pay+sodaPay}${sodaPay?"（含汽水）":""}`, tier==="perfect"?"good":(tier==="meh"?"":""));
    if(tier==="perfect") AUDIO.perfect(); else if(tier==="ok") AUDIO.coin(); else AUDIO.meh();
  }
  removeCustomer(cust);
  renderHUD(); updateFoot();
}
function removeCustomer(cust){
  const idx = R.customers.indexOf(cust);
  if(idx>=0) R.customers.splice(idx,1);
  const seat = seatAt(cust.seatIdx);
  if(seat){
    seat.className = "seat";
    seat.querySelector(".ava").innerHTML = "";
    seat.querySelector(".cname").textContent = "";
    seat.querySelector(".order-bubble").style.display = "none";
    seat.querySelector(".seat-state").textContent = "";
    seat.querySelector(".patience-wrap").style.visibility = "hidden";
  }
}
function customerLeaves(cust, why){
  R.lost++; R.combo = 0;
  if(cust.isRegular) R.regularOk = false;
  G.rep = Math.max(0, G.rep + repDelta("timeout"));
  AUDIO.leave();
  toast(`${cust.order.custName} 等不及走了`, "bad");
  removeCustomer(cust);
  renderHUD(); updateFoot();
}
function acceptPhone(){
  if(!R || !R.phone || R.phone.state!=="ringing") return;
  R.phone.state = "accepted"; R.phone.t = 0;
  const c = { order:R.phone.order, patience:BALANCE.phoneTime, patienceMax:BALANCE.phoneTime, seatIdx:-1, state:"waiting-cook", isPhone:true };
  R.customers.push(c);
  AUDIO.tap();
  renderPhoneSlot();
  toast("外卖单接了 —— 马上下锅", "");
}
function updateFoot(){
  $("#served-tag").textContent = `${R.served} 碗`;
  $("#combo-tag").textContent = R.combo>1 ? `连击 ×${R.combo}` : "";
  const total = R.spawnedTotal || 1;
  $("#day-progress .fill").style.width = Math.min(100, (R.served+R.lost+R.ruined)/total*100)+"%";
}
function updateSeat(c){
  const seat = seatAt(c.seatIdx);
  if(!seat) return;
  seat.className = "seat occupied" + (c.state==="waiting-cook" ? " clickable" : "");
  if(c.state==="waiting-cook"){
    seat.querySelector(".seat-state").textContent = "点一下 → 下锅";
  } else if(c.state==="cooking"){ seat.querySelector(".seat-state").textContent = "煮着了"; }
  else if(c.state==="prep"){ seat.querySelector(".seat-state").textContent = "调味中"; }
}
function spawnCustomer(isPhone){
  /* 常客剧情日：当天第一位客人就是他 */
  let reg = null;
  if(!isPhone && R.dueRegular && R.spawned===0){
    reg = REGULARS.find(r=>r.id===R.dueRegular);
  }
  const order = makeOrder(G, R.rng, R.params, reg ? Object.assign({name:reg.name}, reg.order) : null);
  if(isPhone){
    R.phone = { order, state:"ringing", t:0 };
    AUDIO.ring();
    renderPhoneSlot();
    return;
  }
  const free = [];
  for(let i=0;i<BALANCE.seats;i++){ if(!R.customers.some(c=>c.seatIdx===i)) free.push(i); }
  if(!free.length) return false;
  const seatIdx = free[0];
  const patMax = BALANCE.patience * (G.upgrades.stool?1.2:1) * R.params.patienceMul;
  const c = { order, patience:patMax, patienceMax:patMax, seatIdx, state:"waiting-cook" };
  R.customers.push(c);
  const seat = seatAt(seatIdx);
  const av = seat.querySelector(".ava");
  if(reg){
    c.isRegular = reg.id;
    av.innerHTML = regularAvatar(reg);
    c.patience = c.patienceMax = patMax * 1.5;   // 熟人愿意多等一会
  }
  else av.innerHTML = genericAvatar(R.rng);
  seat.querySelector(".cname").textContent = c.order.custName;
  const bub = seat.querySelector(".order-bubble");
  bub.style.display = "";
  bub.innerHTML = `${c.order.label}`;
  const pw = seat.querySelector(".patience-wrap"); pw.style.visibility = "";
  seat.classList.add("occupied","clickable");
  updateSeat(c);
  return true;
}
function updateBurner(i){
  const b = R.burners[i];
  const elx = b.el || $("#burners").children[i];
  b.el = elx;
  if(!elx) return;
  if(b.state==="idle" && elx.classList.contains("idle")) return;
  const zoneW = (R.noodleWindow*2/R.cookTime*100);
  let zone = elx.querySelector(".cook-zone");
  if(b.state==="cooking"){
    elx.className = "burner cooking";
    elx.querySelector(".bname").textContent = b.order.dishName;
    elx.querySelector(".bhint").textContent = "到绿区点一下";
    if(!zone){ zone = el("div","cook-zone"); elx.querySelector(".cook-track").appendChild(zone); }
    /* 绿区覆盖 [1-pw, 1+pw] */
    zone.style.left = Math.max(0,(1 - R.noodleWindow/R.cookTime)*100)+"%";
    zone.style.width = zoneW+"%";
    const p = Math.min(100, b.t/R.cookTime*100);
    elx.querySelector(".cook-fill").style.width = p+"%";
  }
}
function tick(dt){
  if(!R || !R.running || R.paused) return;
  if(R.blackoutT>0){ R.blackoutT -= dt; }
  if(R.params.blackout && !R.blackoutDone && R.t>100){
    R.blackoutDone = true; R.blackoutT = 6;
    toast("跳闸了！几秒钟点不着火", "bad"); AUDIO.fail();
  }
  R.t += dt;
  /* 外卖单：灶眼一空就自动下锅 */
  R.customers.forEach(c=>{
    if(c.isPhone && c.state==="waiting-cook"){
      const bi = R.burners.findIndex(b=>b.state==="idle");
      if(bi>=0 && R.blackoutT<=0){
        const b = R.burners[bi];
        b.state="cooking"; b.t=0; b.order=c.order; b.customer=c;
        c.state="cooking";
        AUDIO.pour();
      }
    }
  });
  /* 生成客人 */
  if(R.spawned < R.toSpawn){
    R.nextSpawn -= dt;
    if(R.nextSpawn <= 0){
      const prog = Math.min(1, R.spawned/Math.max(1,R.toSpawn));
      let gap = BALANCE.spawnGap.start + (BALANCE.spawnGap.end-BALANCE.spawnGap.start)*prog;
      if(R.params.rushFront && R.spawned<5) gap *= 0.45;
      gap /= Math.max(0.7, G.rep/60);
      const ok1 = spawnCustomer(false);
      if(ok1){
        R.spawned++;
        if(R.rng()<BALANCE.doubleSpawnP && R.spawned<R.toSpawn){
          if(spawnCustomer(false)) R.spawned++;
        }
      }
      R.nextSpawn = gap * (0.8 + R.rng()*0.5);
      R.spawnedTotal = R.toSpawn;
    }
  }
  /* 外卖 */
  if(G.upgrades.phone){
    if(R.phone && R.phone.state==="ringing"){
      R.phone.t += dt;
      if(R.phone.t > BALANCE.phoneRingTime){
        R.phone = null; renderPhoneSlot();
        toast("电话没人接，单跑了", "bad");
      }
    } else if(!R.phone){
      R.phoneCd -= dt;
      if(R.phoneCd<=0){
        const p = BALANCE.phoneP * (R.params.phoneMul||1);
        if(R.rng()<p && R.spawned < R.toSpawn){ spawnCustomer(true); }
        R.phoneCd = 14 + R.rng()*10;
      }
    }
    if(R.phone && R.phone.state==="accepted"){
      R.phone.t += dt;
      if(R.phone.t > BALANCE.phoneTime){
        const c = R.customers.find(x=>x.isPhone && x.state!=="served");
        if(c){ R.lost++; R.combo=0; G.rep=Math.max(0,G.rep-1.5); toast("外卖超时了","bad"); removeCustomer(c); }
        R.phone = null; renderPhoneSlot();
      } else renderPhoneSlot();
    }
  }
  /* 客人耐心 */
  R.customers.slice().forEach(c=>{
    if(c.isPhone || c.state==="served") return;
    c.patience -= dt;
    const seat = seatAt(c.seatIdx);
    if(seat){
      const pct = Math.max(0, c.patience/c.patienceMax);
      const bar = seat.querySelector(".patience-bar");
      bar.style.width = pct*100+"%";
      bar.className = "patience-bar"+(pct<0.25?" low":(pct<0.55?" mid":""));
    }
    if(c.patience<=0) customerLeaves(c, "timeout");
  });
  /* 灶台 */
  R.burners.forEach((b,i)=>{
    if(b.state!=="cooking") return;
    b.t += dt;
    if(R.blackoutT>0){ /* 停电：火灭，计时冻住 */ }
    if(b.t > R.cookTime + R.goodWindow + BALANCE.soggy){
      /* 坩了 */
      b.state="idle"; b.order=null;
      const elx = $("#burners").children[i];
      elx.classList.add("trashed");
      setTimeout(()=>elx.classList.remove("trashed"),350);
      elx.className = "burner idle"; elx.querySelector(".bname").textContent=""; elx.querySelector(".bhint").textContent="";
      elx.querySelector(".cook-fill").style.width="0";
      const z=elx.querySelector(".cook-zone"); if(z) z.remove();
      const cust = b.customer;
      if(cust && cust.state==="cooking"){ cust.state="waiting-cook"; updateSeat(cust); }
      b.customer=null;
      R.ruined++; R.combo=0; G.totalRuined++;
      toast("面坨在锅里了！", "bad"); AUDIO.fail();
      return;
    }
    updateBurner(i);
  });
  renderHUD();
  updateFoot();
  /* 收摊判定 */
  const fieldEmpty = R.spawned>=R.toSpawn && R.customers.length===0 && R.prepQueue.length===0 && !R.prep && !R.burners.some(b=>b.state==="cooking") && !(R.phone&&R.phone.state==="ringing");
  const timeUp = R.t > 240;
  if((fieldEmpty && R.spawned>0) || (timeUp && R.customers.length===0 && !R.prep)){
    endDay();
  }
}

/* ---------- 日结 ---------- */
function endDay(){
  R.running = false; R.over = true;
  const bowls = R.served;
  const spiceAvg = BALANCE.spiceCost[1]*R.params.spiceMul*(G.zhouDiscount||G.niangDiscount?0.8:1);
  const cost = dayCost(bowls, spiceAvg/ BALANCE.spiceCost[1], G);
  const profit = Math.round(R.revenue - cost);
  G.money += profit;
  G.dayLog.push({ day:G.day, revenue:R.revenue, cost, profit, served:R.served, lost:R.lost, ruined:R.ruined });
  /* 常客剧情：这碗面做到位了，故事才算发生 */
  let regularHtml = "";
  if(R.dueRegular){
    const reg = REGULARS.find(r=>r.id===R.dueRegular);
    if(R.regularOk){
      const scene = reg.scenes[G.regulars[reg.id]];
      G.regulars[reg.id]++;
      if(scene.fn) scene.fn({G});
      regularHtml = `<div class="figure">${reg.svg}</div><p><b>${reg.name}</b>：${scene.text}</p><p style="color:var(--goldt)">${scene.gain||""}</p>`;
    } else {
      regularHtml = `<p>${reg.name}的这碗面没做到位。他的事，只有改天再说了。</p>`;
    }
  }
  /* 里程碑检查 */
  const mileToday = BALANCE.milestoneDays.includes(G.day);
  let mileFail = false;
  if(mileToday){
    const target = BALANCE.milestones[G.day] + G.interest;
    if(G.money - BALANCE.payFloor >= target - G.debtPaid){
      const pay = target - G.debtPaid;
      G.money -= pay; G.debtPaid += pay;
    } else {
      mileFail = true; G.missedMilestones++; G.interest += BALANCE.interestMiss;
    }
  }
  saveGame();
  showSettle({ profit, cost, mileToday, mileFail, regularHtml });
}
function showSettle(res){
  const last = G.day >= BALANCE.days;
  const tbl = `<table class="settle-table">
    <tr><td>卖面收入</td><td>+¥${Math.round(R.revenue)}</td></tr>
    ${G.upgrades.fridge&&R.soda?`<tr><td>汽水</td><td>含在收入里（${R.soda}瓶）</td></tr>`:""}
    <tr><td>房租水电</td><td>-¥${res.cost}</td></tr>
    <tr><td>跑了 / 砸了</td><td>${R.lost} / ${R.ruined}</td></tr>
    <tr class="total"><td>今日净利</td><td>${res.profit>=0?"+":""}¥${res.profit}</td></tr>
    <tr><td>口碑</td><td>${Math.round(G.rep)}</td></tr>
    <tr><td>欠款余额</td><td>¥${BALANCE.debt-G.debtPaid}</td></tr>
  </table>
  ${res.mileFail?`<p style="color:var(--bad)">还款没凑够，债主撂下狠话。利息 +¥${BALANCE.interestMiss}。</p>`:""}

  ${res.regularHtml||""}

  community: { text:"街坊红白喜事，都来你这儿订面。老周在墙上钉了个挂钩，专门挂熟客的扁担。外婆出院那天，半条巷子的人来接。你说不清是面馆养活了你，还是巷子养活了面馆。", tone:"good" },
  fifty: { text:"「小面五十强」的铜牌挂上门楣那天，陈记者来拍了张照片：你站在灶前，身后是排队的人。牌子上写「竹器巷 · 陈记」。你把它擦了又擦，摆在外婆的柜子旁边。", tone:"good" },
  second: { text:"第二家店选在江对岸，开业那天老周扛来一挂鞭。你教徒弟吊汤，说的还是外婆那句：「汤宽，面才立得起。」牌子换了新的，灶火还是原来那一灶。", tone:"good" },
  grandma: { text:"三十年前，外婆也是这样站在灶前。你把她的旧围裙洗得发白，系在腰上。今天老周、雷师傅、陈记者、老板娘都来了，一人一碗，谁也没说话。汤面上浮着葱花，热气把每个人的眼镜都熏白了。——这碗面的名字，叫外婆。", tone:"grandma" },
};
function showEnding(){
  const e = endingCalc(G);
  META.endings[e.id] = true;
  META.bestMoney = Math.max(META.bestMoney, Math.round(G.money));
  META.bestRep = Math.max(META.bestRep, Math.round(G.rep));
  META.runs++;
  saveMeta();
  const tone = ENDINGS[e.id].tone;
  const scr = $("#scr-ending");
  scr.innerHTML = `
    <div class="ending-title">${e.title}</div>
    <div class="ending-grade">结局评定 · ${e.grade}</div>
    <div class="ending-body">${ENDINGS[e.id].text}</div>
    <div class="ending-stats">
      <div><span>三十天总营业额</span><b>¥${G.dayLog.reduce((a,d)=>a+d.revenue,0)}</b></div>
      <div><span>总出餐</span><b>${G.totalServed} 碗</b></div>
      <div><span>最高连击</span><b>×${G.bestCombo||0}</b></div>
      <div><span>最终口碑</span><b>${Math.round(G.rep)}</b></div>
      <div><span>还清欠款</span><b>${G.debtPaid>=BALANCE.debt?"是（¥"+BALANCE.debt+"）":"否，还剩 ¥"+(BALANCE.debt-G.debtPaid)}</b></div>
      <div><span>兜里余额</span><b>¥${Math.round(G.money)}</b></div>
    </div>
    <canvas id="poster-canvas" width="540" height="810"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn primary" id="btn-again">再开一局</button>
      <button class="btn" id="btn-saveposter">存海报</button>
    </div>
    <div class="tips">已解锁结局：${Object.keys(META.endings).length} / ${Object.keys(ENDINGS).length} · 结局判定看：欠款、口碑、常客故事线、存款</div>`;
  showScreen("ending");
  drawPoster(e);
  $("#btn-again").onclick = ()=>{ closeModal(); toTitle(); };
  $("#btn-saveposter").onclick = ()=>{
    const a = document.createElement("a");
    a.download = "开个面馆-结局.png";
    a.href = $("#poster-canvas").toDataURL("image/png");
    a.click();
  };
  localStorage.removeItem(BALANCE.saveKey); G = null;
}
function drawPoster(e){
  const cv = $("#poster-canvas"); if(!cv) return;
  const c = cv.getContext("2d");
  const W = 540, H = 810;
  c.fillStyle = "#f6f1e6"; c.fillRect(0,0,W,H);
  c.fillStyle = "#2b2320"; c.fillRect(40,40,W-80,6);
  c.fillStyle = "#b8402e";
  c.font = "bold 44px 'PingFang SC','Microsoft YaHei',sans-serif";
  c.textAlign = "center";
  c.fillText("开个面馆", W/2, 120);
  c.font = "16px sans-serif"; c.fillStyle = "#8a7c6e";
  c.fillText("山城清晨 · 三十天", W/2, 148);
  c.fillStyle = ENDINGS[e.id].tone==="bad" ? "#a03428" : (ENDINGS[e.id].tone ? "#2f6b4f" : "#57493f");
  c.font = "bold 34px 'PingFang SC',sans-serif";
  c.fillText("「"+e.title+"」", W/2, 220);
  c.fillStyle = "#57493f"; c.font = "15px sans-serif";
  const lines = [
    "出餐 "+G.totalServed+" 碗 · 最高连击 ×"+(G.bestCombo||0),
    "口碑 "+Math.round(G.rep)+" · 余额 ¥"+Math.round(G.money),
    G.debtPaid>=BALANCE.debt ? "欠款：已还清" : "欠款：剩 ¥"+(BALANCE.debt-G.debtPaid),
  ];
  lines.forEach((l,i)=>c.fillText(l, W/2, 280+i*30));
  /* 一碗面 */
  c.save(); c.translate(W/2, 420); c.scale(2.4,2.4);
  c.fillStyle="#b8402e"; c.beginPath(); c.arc(0,0,34,0,Math.PI); c.fill();
  c.fillStyle="#f0d9a8"; c.beginPath(); c.ellipse(0,-4,30,10,0,0,Math.PI*2); c.fill();
  c.strokeStyle="#d4553f"; c.lineWidth=3; c.beginPath(); c.moveTo(-20,-6); c.quadraticCurveTo(0,4,20,-6); c.stroke();
  c.fillStyle="#7c5a2e"; c.beginPath(); c.arc(-8,-9,4,0,7); c.fill();
  c.fillStyle="#5e7a4a"; c.beginPath(); c.arc(9,-10,3,0,7); c.fill();
  c.strokeStyle="#8a5a34"; c.lineWidth=3; c.beginPath(); c.moveTo(28,-8); c.lineTo(48,-30); c.stroke();
  c.restore();
  c.fillStyle = "#8a7c6e"; c.font = "13px sans-serif";
  c.fillText("—— 灶上的火不等人 ——", W/2, 560);
  c.fillStyle = "#2b2320"; c.fillRect(40, 720, W-80, 3);
  c.fillText("评语 · "+e.grade, W/2, 760);
}

/* ---------- 暂停 / 设置 ---------- */
function pauseToggle(){
  if(!R || !R.running) return;
  if(R.paused && modalPauseCb) return;
  R.paused = !R.paused;
  if(R.paused){
    modal("歇口气", "<p>面馆打了个烊（暂停）。水还温着，客人还在等。</p>",
      [{name:"继续营业", primary:true, fn:()=>{}}]);
  }
}

/* ---------- 标题 ---------- */
function toTitle(){
  R = null;
  showScreen("title");
  refreshTitle();
}
function refreshTitle(){
  const hasSave = !!(G && G.day>0);
  $("#btn-continue").disabled = !hasSave;
  $("#btn-continue").textContent = hasSave ? `继续 · 第 ${G.day} 天` : "继续经营";
}
function startNew(){
  newGame();
  META.runs = (META.runs||0)+1; saveMeta();
  saveGame();
  showHelp(()=>{
    modal("外婆的债", "<p>外婆住院了，面馆交到你手上。</p><p>三十天，欠款 <b>¥15000</b>：第 10 天还 3000，第 20 天累计 8000，第 30 天还清。</p><p>灶上的火不等人。手要快，心要稳。</p>",
      [{name:"接下面馆", primary:true, fn:()=>{ G.day = 1; showDayBrief(); }}], "开张");
  });
}
function showHelp(done){
  modal("怎么玩",
    `<p><b>1.</b> 客人坐下后<b>点客人</b> → 面下锅（占一个灶眼）。</p>
     <p><b>2.</b> 灶眼上的进度条走到<b>绿区</b>时点灶眼捞面：早了夹生，晚了坨。</p>
     <p><b>3.</b> 面进调味台后，<b>按气泡上的配方顺序</b>点佐料。特辣要多放油辣子，点错扣品质。</p>
     <p><b>4.</b> 调完自动出餐。客人耐心有限，等太久会走。</p>
     <p>连击加钱，口碑引流。每天收摊后可以添设备、上新菜。</p>`,
    [{name:"晓得了", primary:true, fn:()=>done&&done()}], "玩法");
}

/* =====================================================================
   BOOT
   ===================================================================== */
if(!HEADLESS){
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden && R && R.running && !R.paused) pauseToggle(); });
  $("#btn-new").onclick = ()=>{ AUDIO.tap(); startNew(); };
  $("#btn-continue").onclick = ()=>{ AUDIO.tap(); if(loadGame()){ showDayBrief(); } };
  $("#btn-help").onclick = ()=>{ showHelp(null); };
  $("#btn-pause").onclick = ()=>{ pauseToggle(); };
  $("#btn-save-tools").onclick=saveTools;
  window.addEventListener("storage",e=>{if(e.key===BALANCE.saveKey){if(R)R.paused=true;toast("另一标签页进度已变化，请刷新后继续");}});
  loadMeta();
  if(!loadGame()) G = null;
  refreshTitle();
  /* 主循环 */
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    if(R && R.running) tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* 导出给无头测试 */
if(typeof globalThis!=="undefined"){
  globalThis.__KMG = { BALANCE, DISHES, TOPPINGS, MENU_ORDER, UPGRADES, EVENTS, REGULARS,
    makeRng, makeOrder, unlockedMenu, dayParams, customersOfDays, computeQuality, qualityTier,
    payOf, repDelta, dayCost, endingCalc, newGame, getG:()=>G, EVENTS_pick:null };
}

/* PWA：离线可玩 */
if(!HEADLESS && "serviceWorker" in navigator){
  addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
