<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173f3b"><title>五灵问道 · 战斗样板</title><link rel="stylesheet" href="style.css?v=lab1"><style>[hidden]{display:none!important}.lab-head{padding:10px 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}.lab-head b{font-size:18px}.lab-head small{display:block;font-size:11px;color:#c8d7bd}.lab-head button{min-height:32px;font-size:11px;padding:5px 8px}.level-count,.xp-track{display:none!important}.survivor-buttons{gap:8px}.survivor-buttons button{width:65px;height:65px}.survivor-buttons button span{font-size:12px}.survivor-buttons button strong{font-size:24px}.lab-strike{background:linear-gradient(#d8cd98,#9e8850);color:#234b3d}.action-bottom{gap:4px}.action-bottom small{font-size:10px}.action-bottom button{font-size:11px}.lab-end{position:absolute;inset:0;z-index:10;background:#12372bdc;display:grid;place-items:center;text-align:center;padding:20px}.lab-end[hidden]{display:none}.lab-end h2{font-size:29px}.lab-end p{font-size:13px}.lab-end button{width:100%;margin-top:12px}.combat-message{font-size:10px}@media(max-height:650px){.lab-head{padding:4px}.lab-head b{font-size:16px}.lab-head small{font-size:9px}.survivor-buttons button{width:55px;height:55px}.survivor-buttons button small{font-size:8px}.survivor-buttons button strong{font-size:20px}.survivor-field .move-pad{width:88px;height:88px}.survivor-field .action-intro p{font-size:10px}.survivor-field .action-intro{padding:12px}}
</style><script defer src="action-core.js?v=lab1"></script><script defer src="action-view.js?v=lab1"></script><script defer src="lab.js?v=lab1"></script></head><body><main id="app" class="combat-mode"><div class="lab-head"><div><b>青岚 · 树灵试剑</b><small>单角色动作样板 · 64帧图集</small></div><button id="auto">自动御剑 开</button></div><div class="content"><div class="action-hud survivor-hud"><div class="hero-hud"><div><div class="row between"><b>青岚 <em class="actor-state">凝神</em></b><span class="life-count">100 / 100</span></div><div class="life-track"><i class="player-life"></i></div><div class="xp-track"><i class="xp-life"></i></div></div><b class="level-count">Lv.1</b></div><div class="row between"><span class="wave-count">练习 0:00</span><span class="kills-count">击破 0</span><div class="row"><button data-action="sound">音效 开</button><button data-action="heal"><span>回息 ×3</span></button></div></div></div><section class="action-field survivor-field" id="actionField" tabindex="0"><canvas></canvas><div class="action-field-top"><span>一对一 · 木灵守卫</span><button class="action-pause">Ⅱ 暂停</button></div><div class="combat-message">拖动摇杆走位，自动御剑；也可关闭自动，点斩击出招。</div><div class="boss-hud" hidden><b></b><div><i></i></div></div><div class="build-strip"></div><div class="move-pad"><span class="pad-arrows">↑<br>←　→<br>↓</span><i></i><b>移动走位</b></div><div class="survivor-buttons"><button data-action="dash" class="survivor-dash"><strong>»</strong><span>闪避</span><small>空格 / K</small></button><button id="strike" class="lab-strike"><strong>剑</strong><span>斩击</span><small>J</small></button><button data-action="burst" class="survivor-burst" hidden><strong></strong><span></span><small></small></button></div><div class="action-overlay"><div class="action-intro"><span>先试一个角色与一种怪物</span><div class="intro-sprite qinglan"></div><h2>青岚 · 树灵试剑</h2><p>拖动摇杆移动，空格或右侧按钮闪避。<br>默认自动御剑，也可关闭后用 J 或斩击按钮出招。<br>树灵蓄力会亮起范围，及时避开。</p><button class="action-start primary">载入动画…</button><small>独立练习，不读取或写入主线存档</small></div></div><div class="upgrade-overlay" hidden></div><div class="lab-end" hidden><div><h2></h2><p></p><button id="retry">再试一场</button></div></div></section><div class="action-bottom"><small>移动 WASD · 斩击 J · 闪避 空格</small><button id="reset">重新练习</button></div></div></main></body></html>
